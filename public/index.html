// --- 직원 실시간 행동 (5분 단위 시뮬레이션) ---
const PANT={murder:'살해',suicide:'자살',wander:'배회',release:'격리 해제'};
function agentSim(m,pAb){
  const pe0=G.pe;let done=0;const notes=[];
  for(let t=5;t<=m;t+=5){const now=G.min-m+t;for(const ag of G.agents){if(ag.alive)agentStep(ag,now,pAb,notes,()=>done++)}}
  if(done)log(`동료 작업 ${done}건 완료 · 에너지 +${G.pe-pe0} PE`,'npc');
  notes.forEach(n=>log(n,'npc'));
}
function agentStep(ag,now,pAb,notes,count){
  if(ag.panic)return panicStep(ag);
  ag.hp=Math.min(agMax(ag),ag.hp+Math.round(agMax(ag)*.012));ag.sp=Math.min(45,ag.sp+1);
  if(ag.sp<=-45)return startPanic(ag);
  const T=ag.task||{k:'idle',until:0};
  if(now<T.until)return;
  if(T.k==='move'){const a=ABM[T.ab];ag.task={k:'work',ab:T.ab,until:now+Math.round(workMin(a))};return}
  if(T.k==='work'){const a=ABM[T.ab];const s=G.ab[a.id];s.busy=null;if(s.dept){const r=npcWork(ag,a);count();if(r.note)notes.push(r.note)}
    if(ag.alive&&!ag.panic)ag.task={k:'rest',until:now+R(10,30)};return}
  const abs=deptAbs(ag.dept).filter(a=>!a.tool&&!G.ab[a.id].busy&&a.id!==pAb);
  if(ag.hp<agMax(ag)*.4||ag.sp<-25){ag.task={k:'rest',until:now+30};return}
  const melting=abs.filter(a=>G.ab[a.id].melt>0);
  const tgt=melting.length?pick(melting):(abs.length&&chance(.55)?pick(abs):null);
  if(!tgt){ag.task={k:'idle',until:now+R(10,20)};return}
  G.ab[tgt.id].busy=ag.id;ag.task={k:'move',ab:tgt.id,until:now+R(5,10)};
}
function agStatus(ag){
  if(!ag.alive)return '사망';
  if(ag.panic)return `패닉 · ${PANT[ag.panic]}`;
  const T=ag.task;if(!T)return '부서 대기';const left=Math.max(0,T.until-G.min);
  if(T.k==='work')return `${ABM[T.ab].n} 작업 중 · ${left}분`;
  if(T.k==='move')return `${ABM[T.ab].n} 격리실로 이동 중`;
  if(T.k==='rest')return '휴게실에서 회복 중';
  return '복도 대기';
}
// 원작 패닉 유형: 가장 높은 가치관에 따라 용기→살해, 지혜→자살, 절제→배회, 정의→격리 해제
function startPanic(ag){
  const st=ag.st;const k=['F','P','T','J'].sort((x,y)=>st[y]-st[x])[0];
  ag.panic={F:'murder',P:'suicide',T:'wander',J:'release'}[k];ag.panicT=0;ag.sp=-45;
  if(ag.task&&ag.task.ab&&G.ab[ag.task.ab].busy===ag.id)G.ab[ag.task.ab].busy=null;ag.task={k:'panic',until:0};
  log(`${ag.n}(${DEPT[ag.dept].n})이(가) 패닉에 빠졌다 — ${PANT[ag.panic]} 패닉. 동료 돕기에서 진압할 수 있다.`,'hurt');
}
function panicStep(ag){
  ag.panicT=(ag.panicT||0)+5;const t=ag.panicT;
  if(ag.panic==='murder'&&t%15===0){const v=pick(G.agents.filter(x=>x.alive&&x!==ag&&x.dept===ag.dept));
    if(v&&chance(.6)){log(`패닉에 빠진 ${ag.n}이(가) ${v.n}을(를) 공격했다.`,'hurt');agentHurt(v,R(12,22),`${ag.n}의 습격`)}
    else if(ag.dept===G.dept&&chance(.35)){log(`패닉에 빠진 ${ag.n}이(가) 당신에게 달려들었다.`,'hurt');G.hp=Math.max(0,G.hp-R(8,14))}}
  if(ag.panic==='suicide'&&t>=60){log(`${ag.n}이(가) 복도 구석에 주저앉은 채 다시 일어나지 않았다.`,'hurt');agentDie(ag,'자살 패닉')}
  if(ag.panic==='wander'&&t%15===0){const v=pick(G.agents.filter(x=>x.alive&&!x.panic&&x!==ag));if(v){v.sp-=8;if(v.sp<=-45)startPanic(v)}
    if(ag.dept===G.dept){G.sp=clamp(G.sp-3,-45,45);log(`${ag.n}이(가) 중얼거리며 복도를 배회한다. 정신력 -3.`,'hurt')}}
  if(ag.panic==='release'&&t%30===0){const a=pick(deptAbs(ag.dept).filter(x=>!x.tool));if(a){const s=G.ab[a.id];s.cnt=Math.max(0,s.cnt-1);
    log(`패닉에 빠진 ${ag.n}이(가) ${a.n} 격리실 장치를 건드렸다. 카운터 감소.`,'hurt');if(s.cnt<=0)counterZero(a,'panic')}}

let POP=null;
function closePop(){if(POP){POP.remove();POP=null;document.removeEventListener('keydown',popKey)}}
function popKey(e){if(e.key==='Escape')closePop()}
// 팝업: html과 바인딩 함수. 바깥 클릭·Esc·✕로 닫힌다
function popup(title,html,bind,opt){
  closePop();const o=opt||{};
  const ov=document.createElement('div');ov.className='pop';ov.setAttribute('role','dialog');ov.setAttribute('aria-label',title);
  ov.innerHTML=`<div class="pop-card ${o.wide?'wide':''}"><div class="pop-h"><h3>${title}</h3><button class="pop-x" aria-label="닫기">✕</button></div><div class="pop-b">${html}</div></div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)closePop()});
  ov.querySelector('.pop-x').onclick=closePop;
  document.body.appendChild(ov);POP=ov;document.addEventListener('keydown',popKey);
  if(bind)bind(ov.querySelector('.pop-b'));
  const f=ov.querySelector('.pop-b button:not([disabled])');if(f&&f.focus)try{f.focus({preventScroll:true})}catch(e){}
  return ov;
}

  popup(title,html,b=>b.querySelectorAll('.ch').forEach(x=>x.onclick=()=>{const c=choices[+x.dataset.i];if(c.dis)return;closePop();c.f()}));

// 토스트: 중요한 기록을 화면 구석에 잠깐 띄운다
let TOASTN=0;
function toast(text,cls){
  if(!document.body||B)return;let box=document.getElementById('toasts');
  if(!box){box=document.createElement('div');box.id='toasts';box.setAttribute('aria-live','polite');document.body.appendChild(box)}
  while(box.children.length>=4)box.firstChild.remove();
  const t=document.createElement('div');t.className='toast '+(cls||'');t.innerHTML=text;box.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400)},3600);
}

function misProg(){const m=G.mis;if(!m)return 0;const D=MIS[m.k];return D.st?D.st(m):(m.p||0)}
function misEv(e,d){const m=G.mis;if(G.dead)return;if(!m||m.res||m.day!==G.day)return;const D=MIS[m.k];if(D.st)return misCheck();
  const v=D.ev?D.ev(e,d||{},m):0;if(!v)return;if(D.add)m.p=(m.p||0)+v;else m.p=v;misCheck()}
function misCheck(){const m=G.mis;if(!m||m.res||m.day!==G.day)return;const D=MIS[m.k];
  if(misProg()>=D.need&&!D.end){m.res='ok';m.show=1;save();setTimeout(misShow,30)}else if(!G.dead&&$("#daybox"))renderTop()}

  if(m.res==='ok'){D.rf();G.sephRel=G.sephRel||{};G.sephRel[m.k]=(G.sephRel[m.k]||0)+1;hum(2);log(`${S.n}의 부탁을 해냈다 — 「${D.t}」 · ${D.rw}.`,'good');save();
    popChoices(`${S.n} · 「${D.t}」 완료`,`보상: ${D.rw}`,[{l:'"별말씀을요."',f:()=>{render()}},{l:'"다음에도 불러 주세요."',f:()=>{hum(1);log(`${S.n}: "…그 말, 기록해 둘게요."`,'q');render()}}],'',{t:`<b>${S.n}</b> ${D.ok}`,seph:1})}
  else{log(`${S.n}의 부탁 「${D.t}」을(를) 오늘 끝내지 못했다.`,'warn');popChoices(`${S.n} · 「${D.t}」`,'벌칙은 없다. 다음 기회가 또 온다.',[{l:'"미안해요. 다음엔 꼭."',f:()=>render()}],'',{t:`<b>${S.n}</b> ${pick(['"괜찮아요. 오늘은 그런 날이었던 거죠."','"…다음에 다시 부탁하지."','"하루가 다 그렇게 흘러가지."'])}`,seph:1})}}
function misOffer(k,self){
  const D=MIS[k],S=SEPH[k];if(!D)return;G.misOffered=G.day;
  const accept=()=>{G.mis={k,day:G.day,p:0,d0:G.deaths,h0:G.hum,s0:stSum()};log(`${S.n}의 부탁을 받았다 — 「${D.t}」: ${D.goal(G.mis)}.`,'good');toast(`${S.n}의 부탁 · ${D.t}`);save();render();misCheck()};
  const decline=()=>{log(`${S.n}: ${D.no}`,'q');save();render()};

const GIMN={summon:'증식',charge:'충전',enrage:'격노',evade:'왜곡',drain:'포식',regen:'재생',pleasure:'정신 잠식'};

    skills:[S(abHidden(a)?'공격':`${a.eq.wn}`,b,3+(g>>1),2,t,a.dt,sin,on(1+(g>>1),2)),S('짓누름',b-1,2+(g>>1),3,'blunt',a.dt,'sloth')],hooks:{}});

  if(a.gim==='charge'){u.ai=v=>{if(v.charging){v.charging=false;return [big]}if(B.turn%3===2){v.charging=true;blog(`${a.n}이(가) 힘을 모은다. 다음 턴 강공! 흐트러뜨리면 끊긴다.`,'bh');return [v.skills[0]]}return Array.from({length:v.acts},()=>pick(v.skills))};H.onStagger=v=>{if(v.charging){v.charging=false;blog('충전이 끊겼다!','bh')}}}
  if(a.gim==='enrage'){H.onTurnStart=v=>{if(!v.rage&&v.hp<=v.max*.5){v.rage=1;v.acts++;blog(`${a.n}이(가) 격노했다. 행동 +1.`,'bh')}};H.powMod=v=>v.rage?1:0}
  if(a.gim==='evade')H.coinMod=()=>-.12;

function mkPlayer(){const sb=gift('spd')+Math.floor(stE('J')/30)+(G.dept==='control'?1:0);
  return {ally:true,key:'player',n:G.name,hp:G.hp,max:maxHp(),spd:[2+sb,5+sb],w:G.weapon,suit:G.suit,st:{},deck:[],stag:0,stagUsed:false,shield:0,panic:0,corr:0,rank:rank(),pow:gift('pow')+(has('duty')?1:0)+(G.dept==='disc'?1:0)+(G.supDone.disc?1:0)+(G.buff.heart?2:0)}}
function mkAgentAlly(ag){const r=agRank(ag);const sb=Math.floor(ag.st.J/30);
  return {ally:true,key:'ag',ag,co:ag.co,n:ag.n,hp:ag.hp,max:agMax(ag),sp:ag.sp,spd:[2+sb,5+sb],w:agWeap(ag),suit:agSuit(ag),st:{},deck:[],stag:0,stagUsed:false,shield:0,panic:0,corr:0,rank:r,pow:Math.floor(r/2)+(has('duty')?1:0)}}
function allySpV(a){return a.key==='player'?G.sp:a.sp}
function allySp(a,n){if(a.key==='player')return addSp(n);let v=n<0?Math.round(n*.9):n;a.sp=clamp(a.sp+v,-45,45);return v}
function hasMate(co){return B.allies.some(a=>a.co===co&&!a.dead)}

function blog(t,c){log(t,c||'b')}
function addStatus(u,k,p,c){if(!u.st[k])u.st[k]={p:0,c:0};u.st[k].p=Math.min(99,u.st[k].p+p);u.st[k].c=Math.min(99,u.st[k].c+c)}
function ammoMax(){return (has('ammo')?2:0)+(has('ammo2')?1:0)+(G.supDone.central?1:0)}
function startBattle(kind,opt){
  UID=0;
  const allies=[mkPlayer()];
  (opt.mates||[]).forEach(ag=>{if(ag.alive&&!ag.out&&!ag.panic)allies.push(mkAgentAlly(ag))});
  const qn=G.ab.queen;
  if(qn.dept&&opt.ab!=='queen'&&!opt.boss&&qn.cnt===ABM.queen.cnt&&chance(.5)){allies.push({ally:true,key:'queen',n:ABM.queen.n,hp:220,max:220,sp:20,spd:[4,7],w:'lovehate',suit:'lovehate',st:{},deck:[],stag:0,stagUsed:false,shield:0,panic:0,corr:0,rank:4,pow:1});opt.queenJoined=true}
  B={kind,opt,turn:0,units:ENEMY[kind](opt),allies,sins:{},slots:[],intents:[],done:false,charm:false,ammo:ammoMax(),slow:has('slowb')?1:0,shieldOk:has('shieldb')||G.supDone.central};
  if(opt.ab&&ABM[opt.ab]&&abHidden(ABM[opt.ab])&&B.units[0])B.units[0].n=ABM[opt.ab].n;
  if(G.buff.shield)allies[0].shield=10;
  G.phase='ordeal';
  blog(`■ ${opt.title} · 출동: ${allies.map(a=>a.n).join(', ')}`,'bh');
  if(opt.queenJoined)blog(`"악당이 나타났어? 정의의 이름으로!" ${ABM.queen.n}이(가) 격리실을 박차고 나와 합류했다.`,'bh');
  if(ABM[opt.ab]&&ABM[opt.ab].lim)blog('림버스 컴퍼니 관찰일지의 기믹이 반영된 전투다.','b');
  if(kind==='gen'&&B.units[0].gim)blog(`이 환상체의 기믹: ${GIMN[B.units[0].gim]}.`,'b');
  TAB='work';render();newTurn();
}
function kit(a){return weapOf(a.w)}
function drawSkill(a){if(!a.deck.length)a.deck=shuffle([0,0,0,1,1,2]);return kit(a).skills[a.deck.pop()]}
function newTurn(){
  B.turn++;B.charm=false;
  blog(`— ${B.turn}턴 —`,'bh');
  // 림버스: -45가 되면 그 턴 패닉(또는 E.G.O 침식), 다음 턴 시작에 정신력 0. -30 이하는 확률로 사기 저하.
  for(const a of B.allies){if(a.dead)continue;
    if(a.recover){a.recover=false;if(a.key==='player')G.sp=0;else a.sp=0;blog(`${a.n}의 정신력이 0으로 돌아왔다.`,'b')}
    a.panic=0;a.corr=0;a.morale=false;
    if(allySpV(a)<=-45){
      if(a.key==='player'&&kit(a).ego&&kit(a).ego.cor){a.corr=1;blog(`${a.n}: 정신력 -45. E.G.O 침식. 이번 턴 몸이 멋대로 움직인다.`,'bh')}
      else{a.panic=1;blog(`${a.n}: 정신력 -45. 패닉. 이번 턴 행동할 수 없다.`,'bh')}
      if(a.key==='player'&&G.blessed){G.blessed=false;G.ab.knight.cnt=0;blog('가호가 깨졌다. 어딘가에서 기사가 절망한다.','bh');if(G.ab.knight.dept)counterZero(ABM.knight,'bless')}
      a.recover=true;
    }else if(allySpV(a)<=-30&&chance(.5)){a.morale=true;blog(`${a.n}: 사기 저하. 이번 턴 위력 -2.`,'b')}
  }
  for(const u of B.units)if(u.hp>0&&u.hooks.onTurnStart)u.hooks.onTurnStart(u);
  if(checkEnd())return;
  B.intents=[];
  const live=B.allies.filter(a=>!a.dead);
  for(const u of B.units){if(u.hp<=0||u.stag>0)continue;
    const list=u.ai?u.ai(u):Array.from({length:u.acts},()=>pick(u.skills));
    for(const s of list)B.intents.push({u,s,spd:Math.max(1,R(u.spd[0],u.spd[1])-(u.slowed?4:0)),id:B.intents.length,tgt:pick(live)})}
  B.units.forEach(u=>u.slowed=0);
  B.slots=[];
  for(const a of live){
    a.speed=Math.max(1,R(a.spd[0],a.spd[1]));
    if(a.stag>0||a.panic)continue;
    if(a.corr){const c=kit(a).ego.cor;B.slots.push({a,opts:[c,c],pick:0,corr:true,tgt:{k:'rand'}});continue}
    const n=(a.key==='player'&&rank()>=3)||(a.key==='ag'&&a.rank>=4)?2:1;
    for(let i=0;i<n;i++){if(a.key==='player'&&i===0&&B.charm)continue;B.slots.push({a,opts:[drawSkill(a),drawSkill(a)],pick:0,tgt:null})}
  }
  B.slots.forEach((s,i)=>s.id=i);
  B.wc={};autoAssign();renderBattle();
}
/* 합 가능: 그 공격이 나를 노리거나, 내가 더 빠르면 (림버스 규칙) */
function canClash(sl,it){return !sl.corr&&(it.tgt===sl.a||sl.a.speed>it.spd)}
function slotSkill(sl){return sl.ego||sl.opts[sl.pick]}
function ownerOf(it){return B.slots.find(s=>s.tgt&&(s.tgt.k==='clash'||s.tgt.k==='def')&&s.tgt.it===it)}
function freeSlot(sl){const t=B.units.filter(u=>u.hp>0).sort((x,y)=>x.hp-y.hp)[0];sl.tgt=t?{k:'atk',u:t}:null}
function assign(sl,tgt){
  if(tgt.it){const prev=ownerOf(tgt.it);if(prev&&prev!==sl)freeSlot(prev)}
  sl.tgt=tgt;
}
function autoAssign(){
  const taken=new Set();
  for(const sl of B.slots){
    if(sl.corr)continue;
    const cand=B.intents.filter(it=>it.u.hp>0&&!taken.has(it)&&canClash(sl,it)).sort((x,y)=>(y.tgt===sl.a)-(x.tgt===sl.a)||(y.s.base+y.s.cp*y.s.coins)-(x.s.base+x.s.cp*x.s.coins));
    if(cand.length){const it=cand[0];taken.add(it);
      if(!sl.ego){let best=0,bp=-1;sl.opts.forEach((o,j)=>{const p=wc(sl,j,it);if(p>bp){bp=p;best=j}});sl.pick=best}
      sl.tgt={k:'clash',it}}
    else freeSlot(sl);
  }
}
function coinModAll(){let m=0;for(const u of B.units)if(u.hp>0&&u.hooks.coinMod)m+=u.hooks.coinMod(u);return m}
function headP(a){if(!a||!a.ally)return .5;let p=.5+allySpV(a)/100+coinModAll();if(a.key==='player'&&G.flags.bond_doyun_2&&hasMate('doyun'))p+=.05;return clamp(p,.05,.95)}
function powOf(a,s,heads,target){let p=s.base+heads*s.cp;if(a.ally){p+=a.pow||0;if(a.morale)p-=2;if(a.key==='player'&&G.flags.bond_haewon_2&&hasMate('haewon'))p+=1}else if(a.hooks&&a.hooks.powMod)p+=a.hooks.powMod(a,target);return Math.max(0,p)}
function rollPow(a,s,coins,target){let h=0;const pr=headP(a);for(let i=0;i<coins;i++)if(chance(pr))h++;return powOf(a,s,h,target)}
function winChance(a,s,it){let w=0;for(let n=0;n<120;n++){let pc=s.coins,ec=it.s.coins,k=0;while(pc>0&&ec>0&&k<20){const x=rollPow(a,s,pc,it.u),y=rollPow(it.u,it.s,ec,a);k++;if(x>y)ec--;else if(y>x)pc--}if(pc>0)w++}return w/120}
function wc(sl,j,it){const s=j==='ego'?sl.ego:sl.opts[j];const key=sl.id+':'+(j==='ego'?'e':j)+':'+it.id+':'+s.n;if(B.wc[key]===undefined)B.wc[key]=winChance(sl.a,s,it);return B.wc[key]}
function advWord(p){return p>=.85?['매우 우세','hi']:p>=.6?['우세','hi']:p>=.4?['균형','mid']:p>=.15?['불리','lo']:['매우 불리','lo']}
function sinBank(){return Object.entries(B.sins).filter(([,v])=>v>0).map(([k,v])=>`<span><i class="sinpip" style="background:var(--s-${k})"></i>${SINS[k]} ${v}</span>`).join('')||'<span>아직 없음 · 스킬을 쓰면 그 죄악 자원이 쌓인다</span>'}
function powRange(s){return `${s.base}~${s.base+s.cp*s.coins}`}
function sinDot(s){return s.sin?`<i class="sinpip" style="background:var(--s-${s.sin})"></i>`:''}
function stHtml(st){return Object.entries(st).filter(([,v])=>v.p>0).map(([k,v])=>`<span>${STN[k]} ${v.p}${v.c?'/'+v.c:''}</span>`).join('')}
function fxLine(s){return s.on&&Object.keys(s.on).length?' · '+Object.entries(s.on).map(([k,v])=>STN[k]+' '+v[0]).join(' '):''}
function renderBattle(){
  if(!B||B.done)return;
  const pl=B.allies[0],pw=kit(pl);
  const plSlot=B.slots.find(s=>s.a===pl&&!s.corr);

function useEgo(){

  if(e.sp)addSp(-e.sp);
  if(e.cor&&chance(pc)){sl.opts=[e.cor,e.cor];sl.pick=0;sl.corr=true;sl.tgt={k:'rand'};blog(`E.G.O가 당신을 집어삼키려 한다. 「${e.cor.n}」 발동!`,'bh')}
  else{sl.ego=Object.assign({ego:true,sin:e.sin},e.s);blog(`E.G.O 「${e.n}」 발현.`,'bh')}

function fireBullet(){

  B.units.filter(u=>u.hp>0).forEach(u=>{const d=Math.round(22*(u.res.pierce||1)*(1+resMult(u.sres.pride||1)));hitUnit(u,d,B.allies[0]);blog(`${u.n} ${d} 피해 (BLACK)`,'b')});
  B.wc={};if(!checkEnd())renderBattle();
}

/* 피해 처리 */
function allySuitR(a){return a.key==='player'?suitR(a.suit):suitOf(a.suit).r}
function dmgAlly(a,amt,color,src,atkG){
  if(a.dead)return;
  const su=suitOf(a.suit);
  let m=allySuitR(a)[color]*gradeMul((atkG||0)-su.g);
  if(a.key==='player'&&G.blessed)m=Math.min(m,1)*0.85;
  if(a.key==='player'&&G.buff.portrait)m*=.75;
  if(G.supDone.welfare)m*=.9;if(supOn('welfare')&&G.sup.col===color)m*=(G.mLevel>=4?1.75:1.5);
  let d=amt*m;if(a.stag>0)d*=2;if(a.panic)d*=1.3;
  let hpD=d,spD=0;
  if(color==='WHITE'){hpD=d*.5;spD=d*.5}else if(color==='BLACK'){spD=d*.3}
  hpD=Math.round(hpD);
  if(a.shield>0){const ab=Math.min(a.shield,hpD);a.shield-=ab;hpD-=ab;if(ab)blog(`보호막이 ${ab} 흡수.`,'b')}
  const before=a.hp;a.hp=Math.max(0,a.hp-hpD);if(a.key==='player')G.hp=a.hp;
  let t='';if(spD>0){const v=allySp(a,-Math.round(spD));t=` · 정신력 ${v}`}
  blog(`${src} → ${a.n}: 체력 -${hpD}${t}`,'b');
  if(!a.stagUsed&&before>a.max*.35&&a.hp<=a.max*.35&&a.hp>0){a.stag=2;a.stagUsed=true;a.stagT=B.turn;blog(`${a.n}이(가) 흐트러졌다! 다음 턴 행동 불가, 받는 피해 2배.`,'bh')}
  if(a.hp<=0)allyDown(a);
}
function allyDown(a){
  a.dead=true;
  if(a.key==='player')return;
  blog(`${a.n}이(가) 쓰러졌다.`,'bh');
  for(const o of B.allies)if(!o.dead){const loss=10+Math.max(0,(a.rank-o.rank))*10;allySp(o,-loss);blog(`${o.n} 정신력 -${loss}`,'b')}
  if(a.key==='ag')agentDie(a.ag,`${B.opt.title.replace('제압 · ','')} 전투`);
  if(a.key==='queen'){blog(`${ABM.queen.n}이(가) 쓰러졌다. "정의는… 지지 않아…"`,'bh');const s=G.ab.queen;s.cnt=Math.max(0,s.cnt-1)}
}
function hitUnit(u,amt,src){
  const a=amt*(u.stag>0?(has('exec')?2.5:2):1);
  u.hp-=Math.round(a);
  if(u.hp<=0){u.hp=0;onKill(u,src);return Math.round(a)}
  const thr=u.stg[u.stgIdx];
  if(thr!==undefined&&u.stag<=0&&u.hp<=thr*u.max+u.shift){u.stag=2;u.stgIdx++;while(u.stg[u.stgIdx]!==undefined&&u.hp<=u.stg[u.stgIdx]*u.max+u.shift)u.stgIdx++;blog(`${u.n}이(가) 흐트러졌다!`,'bh');if(u.hooks.onStagger)u.hooks.onStagger(u);u.stagT=B.turn}
  return Math.round(a);
}
function onKill(u,src){
  if(u.killed)return;u.killed=true;
  if(!src||!src.ally)return;
  for(const o of B.allies)if(!o.dead)allySp(o,o===src?10:5);
  blog(`${u.n} 제압. ${src.n} 정신력 +10, 다른 아군 +5.`,'b');
}
function resMult(x){return x>=1?x-1:(x-1)/2}
function attackFromAlly(a,s,coins,target,clashes){
  let pow=powOf(a,s,0,target),total=0;
  const pr=headP(a);
  for(let i=0;i<coins;i++){
    if(target.hp<=0||a.dead)break;
    if(chance(pr))pow+=s.cp;
    const bl=a.st.bleed;if(bl&&bl.c>0){dmgAlly(a,bl.p,'RED','출혈',0);bl.c--;if(!bl.c)delete a.st.bleed;if(a.dead)return}
    let mult=(1+resMult(target.res[s.t]||1)+resMult(target.sres[s.sin]||1))*(target.hooks.resMul?target.hooks.resMul(target):1)*(1+0.03*clashes)*gradeMul(kit(a).g-target.g);
    if(a.st.poise&&a.st.poise.c>0&&chance(a.st.poise.p*.05)){mult*=1.2;a.st.poise.c--;blog('치명타!','b')}
    let d=hitUnit(target,Math.max(1,pow*mult),a);
    const rp=target.st.rupture;if(rp&&rp.c>0&&target.hp>0){d+=hitUnit(target,rp.p,a);rp.c--;if(!rp.c)delete target.st.rupture}
    const sk=target.st.sinking;if(sk&&sk.c>0&&target.hp>0){d+=hitUnit(target,sk.p,a);sk.c--;if(!sk.c)delete target.st.sinking}
    total+=d;
    for(const k in (s.on||{})){const [p,c]=s.on[k];if(k==='poise')addStatus(a,k,p,c);else addStatus(target,k,p,c)}
    if(s.heal)allySp(a,s.heal);
    if(s.hpheal){a.hp=Math.min(a.max,a.hp+s.hpheal);if(a.key==='player')G.hp=a.hp}
    if(s.lifesteal){a.hp=Math.min(a.max,a.hp+Math.round(d*s.lifesteal));if(a.key==='player')G.hp=a.hp}
  }
  if(s.burst&&target.st.tremor&&target.hp>0){target.shift+=target.st.tremor.p;blog(`진동 폭발! ${target.n}의 흐트러짐 지점이 ${target.st.tremor.p} 당겨졌다.`,'b');target.st.tremor.c--;if(target.st.tremor.c<=0)delete target.st.tremor;hitUnit(target,0,a)}
  if(s.sinkBonus&&target.st.sinking&&target.hp>0)total+=hitUnit(target,target.st.sinking.c,a);
  if(s.sin)B.sins[s.sin]=(B.sins[s.sin]||0)+1;
  blog(`→ ${a.n}의 ${s.n}: ${target.n}에게 ${total} 피해.`,'b');
}
function attackFromEnemy(u,s,coins,clashes,tgt,def){
  if(tgt.dead){const l=B.allies.filter(x=>!x.dead);if(!l.length)return;tgt=pick(l)}
  if(s.lfx&&typeof lfxUse==='function')lfxUse(u,s,tgt);
  let pow=powOf(u,s,0,tgt);
  let evadeLeft=def&&def.type==='evade';
  for(let i=0;i<coins;i++){
    if(tgt.dead||u.hp<=0)break;
    const hd=chance(headP(u));if(hd)pow+=s.cp;
    if(u.st.bleed&&u.st.bleed.c>0){hitUnit(u,u.st.bleed.p);u.st.bleed.c--;if(!u.st.bleed.c)delete u.st.bleed;if(u.hp<=0)break}
    if(evadeLeft){const ev=rollPow(tgt,def,1);if(ev>=pow){blog(`${tgt.n} 회피 성공 (${ev} ≥ ${pow}).`,'b');continue}else evadeLeft=false}
    const hpBefore=tgt.hp;
    dmgAlly(tgt,pow*(1+0.03*clashes),s.c,`${u.n}의 ${s.n}`,u.g);
    if(u.hooks.onHit)u.hooks.onHit(u,hpBefore-tgt.hp);
    for(const k in (s.on||{})){const [p,c]=s.on[k];addStatus(tgt,k,p,c)}
    if(s.lfx&&typeof lfxHit==='function')lfxHit(u,s,tgt,i,hd,hpBefore-tgt.hp);
    const sk=tgt.st.sinking;if(sk&&sk.c>0&&!tgt.dead){allySp(tgt,-sk.p);blog(`침잠: ${tgt.n} 정신력 -${sk.p}`,'b');sk.c--;if(!sk.c)delete tgt.st.sinking}
  }
}

function other60(a,who,ctx){const q={quiet:1};const P=st60();

function cr60(a,res,ctx){if(!a||a.tool)return 0;const s=G.ab[a.id];const ag=ctx.ag;const who=ag?ag.id:'player';
  const L=k=>ag?lv(ag.st[k]):lv(stE(k));
  const parts=[],says=[];
  const x={res,w:ctx.w,L,who,ag,maxPE:ctx.succ!=null&&ctx.succ>=ctx.boxes,
    panic:ag?ag.sp<=-45:G.sp<=-45,died:ag?ag.hp<=0:G.hp<=0,hpLow:ag?ag.hp<agMax(ag)*.5:G.hp<maxHp()*.5,
    watched(){const n=agentsIn(s.dept).filter(o=>o!==ag&&!o.panic&&!o.out).length;return chance(Math.min(.85,.3*n))},
    add(d,why){parts.push([d,why])},say(t){says.push(t)}};
  if(!s.esc){
    if(NOCNT60.has(a.id)){}
    else if(CR60[a.id])CR60[a.id](x);
    else BAD60(x);   // 나무위키 자료가 없는 환상체: 기존 규칙(나쁨 -1)
    if(x.panic&&PANIC60.has(a.id))x.add(-1,'작업 중 패닉');
  }
  const P=st60();(P.wk[who]=P.wk[who]||{})[a.id]=1;

abPop=(f=>function(a){f(a);try{if(!a||a.tool)return;const b=POP&&POP.querySelector('.pop-b');if(!b)return;const s=G.ab[a.id],i=infoOf(a);
  const secs=[...b.querySelectorAll('.isec')];const anchor=secs.find(x=>(x.querySelector('.lbl')||{}).textContent==='탈출 정보')||secs[secs.length-1];if(!anchor)return;
  const rec=REC60[a.id];const ob=s.obs||0;
  const recH=rec?rec.map((t,k)=>ob>=k+1?`<p>${k+1}. ${t}</p>`:`<p class="note">${k+1}. 관찰 ${ROMAN[k+1]}에서 열린다</p>`).join(''):'<p class="note">남아 있는 기록이 없다.</p>';
  const rule=NOCNT60.has(a.id)?'클리포트 카운터가 없다 (원작). 다른 방식으로 관리한다.':(CRT60[a.id]||'결과 나쁨 -1 (기록이 부족해 기본 규칙을 따른다)');
  const ruleH=(i.e||i.m[0]||i.m[1])?`<p>${rule}</p>`:'<p class="note">관리 방법 또는 탈출 정보를 해금하면 공개된다.</p>';
  anchor.insertAdjacentHTML('afterend',`<div class="isec"><span class="lbl">클리포트 카운터 규칙</span>${ruleH}</div><div class="isec"><span class="lbl">환상체 기록</span>${recH}<p class="note">나무위키 도감의 내용을 요약해 다시 쓴 것이다.</p></div>`)}catch(e){}})(abPop);

.btn.ghost:hover:not(:disabled){background:#35444a!important}
.chip{border-radius:2px!important;border-color:transparent!important;background:var(--panel2)}
.guide-btn{border-color:transparent!important;background:var(--panel2)!important;border-radius:2px!important}
.pop-x{border-color:transparent!important;background:var(--panel2)!important;border-radius:2px}

/* 이야기 · 기록: 옆 색 띠 대신 가라앉은 면과 화자 이름의 색 */
.story{background:var(--sunk)!important;border-left:0!important;border-radius:2px!important;padding:14px 18px!important}

.dr62 .dr-x{border-left:0!important;background:var(--sunk)!important;border-radius:2px}

.toast{border:0!important;background:var(--raised)!important;padding-left:30px!important;position:relative}
.toast::before{content:"";position:absolute;left:12px;top:15px;width:8px;height:8px;border-radius:1px;background:var(--muted)}
.toast.hurt::before{background:var(--c-red)}.toast.good::before{background:var(--good)}
.wr62{border:0!important;background:var(--raised)!important;box-shadow:0 16px 40px rgba(0,0,0,.45)!important}
.wr62 .wr-g span{background:var(--panel2)!important}
.ord62{border:0!important;background:var(--panel)!important;box-shadow:0 20px 50px rgba(0,0,0,.5)!important}
.ord62 b{color:var(--accent)}
.pop-card{border:0!important;border-top:3px solid var(--dept)!important}
.act59{border:0!important}

.theend{min-height:100dvh!important}
