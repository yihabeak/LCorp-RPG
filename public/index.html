<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Lobotomy Corporation 팬메이드 관리 RPG"><meta name="theme-color" content="#12181a"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>L사 지부 근무일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Oswald:wght@500;600&display=swap">
<style>
/* v8: 심플·모던 + 로보토미 흔적(호박색 HUD, 마름모 표식, 영문 소제목, 칸 게이지, 한쪽만 잘린 모서리, 옅은 격자).
   v7: 심플·모던. 평평한 면, 얇은 테두리, 작은 라운드, 넉넉한 여백.
   원작 색 의미는 유지: RED·WHITE·BLACK(보라)·PALE(청록) = 본능·통찰·애착·억압 = 용기·지혜·절제·정의
   위험 등급: ZAYIN 초록 · TETH 파랑 · HE 노랑 · WAW 보라 · ALEPH 빨강 */
:root{
  --ground:#0b0c0e; --panel:#131417; --panel2:#1a1c20; --sunk:#0e0f11; --line:#2e3239; --line2:#3d424a;
  --fg:#f3f4f6; --fg2:#d4d8df; --muted:#a3a9b3; --accent:#f0a830; --accent2:#f6c262; --accent-ink:#1a1204; --accent-soft:rgba(240,168,48,.12);
  --c-red:#ef5b51; --c-white:#ece7da; --c-black:#a67ce6; --c-pale:#4cc9cf;
  --red:var(--c-red); --white:var(--c-white); --black:var(--c-black); --pale:var(--c-pale);
  --good:#5fcf8a; --bad:#f2786d; --sp-pos:#5aa9f0; --sp-neg:#a67ce6;
  --g0:#3ecf74; --g1:#4c9dff; --g2:#f2c94c; --g3:#a66bff; --g4:#ff4d4d;
  --s-wrath:#e2574c; --s-lust:#f09a4c; --s-sloth:#e6cf5a; --s-gluttony:#9fd05a; --s-gloom:#5ac3d9; --s-pride:#5a7fe6; --s-envy:#ab6bd9;
  --f-display:"IBM Plex Sans KR",sans-serif;
  --f-hud:"Inter","IBM Plex Sans KR",sans-serif; --f-num:"Oswald","Inter",sans-serif;
  --f-body:"IBM Plex Sans KR",sans-serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --r-sm:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--fg)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.65;padding-inline:16px;padding-block:0 48px;margin:0;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(240,168,48,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(240,168,48,.025) 1px,transparent 1px);background-size:40px 40px}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:16px;height:16px;vertical-align:-3px;flex:none}
/* 상단 */
.top{position:sticky;top:0;z-index:5;background:rgba(11,12,14,.94);box-shadow:0 1px 0 rgba(240,168,48,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:1240px;margin-inline:auto;padding-block:12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.top1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.brand::before{content:"";width:12px;height:12px;border:2px solid var(--accent);transform:rotate(45deg);box-shadow:inset 0 0 0 2px var(--ground),inset 0 0 0 6px var(--accent);flex:none}
.brand small{font-family:var(--f-hud);font-size:12.5px;color:var(--accent);letter-spacing:.18em;font-weight:600}
.daybox{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.hud-cell{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;min-height:40px}
.hud-cell.grow{flex:1 1 240px}
.hud-cell .hl{font-family:var(--f-hud);font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600;white-space:nowrap;text-transform:uppercase}
.hud-cell .big{font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1}
.hud-cell .num{font-family:var(--f-num);font-size:17px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.hud-cell .lvl{font-family:var(--f-num);font-size:17px;color:var(--c-red);font-weight:700}
.hud-cell .dim{color:var(--muted);font-weight:500}
.hud-cell .ph{font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;font-weight:600}
.segbar{display:flex;gap:3px;flex:1;min-width:80px;height:8px}
.segbar i{flex:1;background:var(--line2);transform:skewX(-20deg)}
.segbar.amber i.on{background:var(--accent)}
.segbar.red i.on{background:var(--c-red)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--fg2);border:1px solid var(--line)}
.chip.acc{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.hot{color:#fff;background:#b8352c;border-color:transparent;align-self:center}
.chip.ok{color:var(--good)}
.wrap{max-width:1240px;margin:18px auto 0;display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}
@media (max-width:880px){.wrap{grid-template-columns:minmax(0,1fr)}.side{order:2}}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r) var(--r) var(--r) 0;padding:18px}
.card::before{content:"";position:absolute;left:18px;top:-1px;width:36px;height:2px;background:var(--accent)}
.lbl{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.lbl[data-en]::before{content:attr(data-en);color:var(--accent);letter-spacing:.16em;font-size:12px;margin-right:8px;font-family:var(--f-hud)}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.who h2{font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
.rank{font-family:var(--f-num);color:var(--accent);font-size:16px;font-weight:500;letter-spacing:.03em}
.bar{height:6px;background:var(--line2);overflow:hidden;position:relative;border-radius:99px}
.bar i{display:block;height:100%;background:var(--c-red);border-radius:99px}
.stat{display:grid;gap:6px;margin-top:14px}
.stat .row{display:flex;justify-content:space-between;font-size:14px;color:var(--fg2);font-variant-numeric:tabular-nums;gap:6px}
.stat .row span:last-child{color:var(--fg);font-family:var(--f-hud);font-weight:600}
.spbar{height:6px;background:var(--line2);position:relative;overflow:hidden;border-radius:99px}
.spbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--fg2)}
.spbar i{position:absolute;top:0;bottom:0}
.virt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:16px}
.virt div{background:var(--panel2);padding:8px 10px;border-radius:var(--r-sm);display:flex;justify-content:space-between;align-items:center;font-size:14.5px;color:var(--fg2)}
.virt div span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--vc);margin-right:7px;vertical-align:1px}
.virt b{font-family:var(--f-num);font-size:17px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
.virt em{font-style:normal;color:var(--muted);font-size:13px;margin-left:5px;font-weight:500}
.vF{--vc:var(--c-red)}.vP{--vc:var(--c-white)}.vT{--vc:var(--c-black)}.vJ{--vc:var(--c-pale)}
.side{display:grid;gap:12px;align-content:start}
.mini{font-size:14.5px;color:var(--fg2);display:grid;gap:6px;margin-top:10px}
.mini b{color:var(--fg);font-weight:600}
.gear{display:grid;gap:6px;margin-top:14px}
.gear div{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;background:var(--panel2);padding:7px 10px;border-radius:var(--r-sm)}
.gear span:first-child{color:var(--muted)}
.res{display:flex;gap:10px;font-family:var(--f-hud);font-size:13px;font-weight:600}
.dept .who h2{display:flex;align-items:center;gap:8px}
.dept .who h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--dc)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px}
.tabs button{background:none;border:0;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--fg2);font-size:14.5px;font-weight:500}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.main{min-width:0;display:grid;gap:14px;align-content:start}
/* 기록 */
.log{max-height:300px;overflow-y:auto;padding:4px 18px 14px;font-size:14.5px;line-height:1.75}
.log p{margin:6px 0;max-width:74ch;color:var(--fg2)}
.log .ts{font-family:var(--f-hud);font-size:12.5px;color:var(--muted);margin-right:8px;font-weight:500}
.log .sys{color:var(--muted);font-size:14.5px}
.log .warn{color:var(--accent2)}
.log .hurt{color:var(--bad)}
.log .good{color:var(--good)}
.log .b{font-size:14px;margin:2px 0;color:var(--muted)}
.log .bh{font-size:14.5px;margin:10px 0 2px;color:var(--fg);font-weight:600}
.log .q{color:var(--fg);padding-left:12px;border-left:2px solid var(--line2)}
.log .npc{font-size:14px;color:#8fb4d3}
.log .seph{color:var(--fg);padding-left:12px;border-left:2px solid var(--pale)}
.loghead{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 2px}
.panel h3{font-weight:700;font-size:21px;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance;display:flex;align-items:center;gap:10px}
.panel h3::before{content:"";width:8px;height:8px;background:var(--accent);transform:rotate(45deg);flex:none}
.panel .sub{color:var(--fg2);font-size:14px;margin:0 0 16px;max-width:80ch}
.story{font-size:15.5px;line-height:1.8;margin:4px 0 16px;padding:12px 16px;max-width:74ch;background:var(--panel2);border-radius:var(--r-sm);border-left:3px solid var(--accent)}
.story.seph{border-left-color:var(--pale)}
.story .spk{display:block;font-size:13px;color:var(--pale);font-weight:600;margin-bottom:2px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.grouplbl{grid-column:1/-1;margin-top:10px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
.grouplbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.ch{position:relative;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r) var(--r) var(--r) 0;padding:12px 14px;cursor:pointer;display:grid;gap:4px;min-width:0;transition:border-color .15s,background .15s}
.ch:hover:not(:disabled){border-color:rgba(240,168,48,.55);background:#1f1d19}
.ch:disabled{opacity:.4;cursor:not-allowed}
.ch b{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14.5px}
.ch small{color:var(--fg2);font-size:13.5px;line-height:1.5}
.ch.melt{border-color:rgba(239,91,81,.7);background:rgba(239,91,81,.07)}
.ch.prim{border-color:var(--accent);background:var(--accent-soft)}
.ch.dim{opacity:.65}
.ch.cu{padding-left:18px;overflow:hidden}
.cu-dept{position:absolute;left:0;top:0;bottom:0;width:3px}
.abc{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.emb{width:44px;height:52px;overflow:hidden;background:var(--sunk);border-radius:var(--r-sm);display:grid;place-items:center}
.emb img{width:100%;height:100%;object-fit:cover}
.emb.big{width:76px;height:90px}
.gr{font-family:var(--f-hud);font-size:12px;letter-spacing:.06em;font-weight:700;padding:2px 7px;border-radius:4px}
.g0{color:var(--g0)}.g1{color:var(--g1)}.g2{color:var(--g2)}.g3{color:var(--g3)}.g4{color:var(--g4)}
.gr.g0{background:rgba(62,207,116,.15)}.gr.g1{background:rgba(76,157,255,.15)}.gr.g2{background:rgba(242,201,76,.15)}.gr.g3{background:rgba(166,107,255,.17)}.gr.g4{background:rgba(255,77,77,.16)}
.dt{font-family:var(--f-hud);font-size:13px;font-weight:700;letter-spacing:.03em}
.dRED{color:var(--c-red)}.dWHITE{color:var(--c-white)}.dBLACK{color:var(--c-black)}.dPALE{color:var(--c-pale)}
.dots{color:var(--accent)}
.qc{display:inline-flex;gap:3px;vertical-align:0}
.qc i{width:7px;height:9px;border:1.5px solid var(--accent);display:inline-block;transform:skewX(-15deg)}
.qc i.on{background:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover:not(:disabled){background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn.ghost:hover:not(:disabled){background:var(--panel2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
#goBtn{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13.5px;color:var(--muted);max-width:76ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
/* 부서 */
.dept{display:grid;gap:8px}
.npcl{display:grid;gap:4px;font-size:14px}
.npcl div{display:flex;justify-content:space-between;gap:6px;background:var(--panel2);padding:6px 10px;border-radius:var(--r-sm)}
.npcl .dead{opacity:.45;text-decoration:line-through}
.fac{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.fac .card{padding:14px}
.fac h4{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.fac h4>span:first-child::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--dc);margin-right:8px}
.locked{opacity:.45}
/* 전투 */
.bf{display:grid;gap:18px}
.sec{display:grid;gap:8px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.unit{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;text-align:left;display:grid;gap:6px}
.unit.dead{opacity:.35}
.unit h4{margin:0;font-size:14.5px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.hpbar{height:6px;background:var(--line2);position:relative;overflow:hidden;border-radius:99px}
.hpbar i{display:block;height:100%;background:var(--c-red)}
.hpbar s{position:absolute;top:0;bottom:0;width:2px;background:var(--accent2)}
.sts{display:flex;gap:4px;flex-wrap:wrap;font-size:13px}
.sts span{padding:1px 7px;background:var(--sunk);color:var(--fg2);border-radius:99px}
.tag{color:var(--accent)!important;background:var(--accent-soft)!important}
.brow{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;position:relative;overflow:hidden}
.brow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.brow.star::before{background:var(--accent)}
.brow.ok::before{background:var(--good)}
.brow.open::before{background:var(--c-red)}
.brow .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.brow .head b{font-size:14.5px}
.brow .meta{font-size:13.5px;color:var(--fg2)}
.brow .state{font-size:13.5px;font-weight:600}
.rsp{display:flex;flex-wrap:wrap;gap:6px}
.rb{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-sm);padding:7px 10px;cursor:pointer;text-align:left;display:grid;gap:1px;min-width:0;font-size:14px;transition:border-color .15s}
.rb small{font-size:13px;color:var(--muted)}
.rb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rb:hover{border-color:var(--fg2)}
.rb .who3{font-size:12.5px;color:var(--muted);font-weight:600}
.adv{font-weight:700}.adv.hi{color:var(--good)}.adv.mid{color:var(--accent2)}.adv.lo{color:var(--bad)}
.allies{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.ally{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;min-width:0}
.ally.dead{opacity:.35}
.ally h4{margin:0;display:flex;justify-content:space-between;gap:6px;font-size:14.5px}
.sinpip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sinbank{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.help{font-size:14px;color:var(--fg2);background:var(--panel2);padding:10px 14px;border-radius:var(--r-sm)}
.help b{color:var(--fg)}
details.help summary{cursor:pointer;color:var(--fg);font-weight:600}
/* 도감 */
.abl{display:grid;gap:10px}
.ab{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px}
.ab .body{display:grid;gap:8px;min-width:0}
.ab header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.ab h4{margin:0;font-size:15.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--f-hud);font-size:13px;color:var(--muted)}
.ab p{margin:0;font-size:14px;color:var(--fg2);max-width:72ch}
.pref{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font-size:13.5px}
.pref span{background:var(--panel);padding:5px 6px;border-radius:var(--r-sm);text-align:center;display:flex;gap:4px;justify-content:center;align-items:center}
@media (max-width:520px){.pref{grid-template-columns:repeat(2,minmax(0,1fr))}.ab{grid-template-columns:minmax(0,1fr)}}
.imgset{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.imgset label{cursor:pointer;text-decoration:underline}
.imgset input{display:none}
/* 타이틀 */
.title{max-width:720px;margin:56px auto;display:grid;gap:20px}
.title h1{font-weight:700;font-size:clamp(28px,5.5vw,42px);margin:0;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.title .lead{font-size:16px;color:var(--fg2);max-width:62ch;margin:0;line-height:1.75}
.field{display:grid;gap:6px}
.field input{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-sm);color:var(--fg);padding:9px 12px;font:inherit;max-width:320px}
.seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.seg button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;cursor:pointer;display:grid;gap:2px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg small{color:var(--fg2);font-size:13.5px}
.rec{max-width:600px;margin:40px auto;border:1px solid var(--line);border-radius:var(--r);padding:24px;background:var(--panel);display:grid;gap:14px}
.rec h2{font-weight:700;margin:0;font-size:24px}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:14px}
.rec dt{color:var(--muted)}.rec dd{margin:0}
.rec p{font-size:15px;margin:0;line-height:1.75}
/* 합 연출: 평면 원형 코인. 앞면=채워진 원, 뒷면=빈 원 */
.rp{position:fixed;inset:0;z-index:50;background:rgba(6,7,8,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.rp-card{width:min(600px,100%);background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--accent);border-radius:14px;padding:20px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.rp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rp-btns{display:flex;gap:6px}.rp-btns .btn{padding:5px 12px;font-size:13.5px}
.rp-side{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who pow" "coins pow";gap:10px 16px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .2s,opacity .2s}
.rp-side.win{border-color:var(--good)}.rp-side.lose{opacity:.6}
.rp-who{grid-area:who;display:grid;gap:1px}.rp-who b{font-size:15px}.rp-who span{font-size:14.5px;color:var(--fg2)}.rp-who small{font-size:13px;color:var(--muted)}
.rp-coins{grid-area:coins;display:flex;gap:10px;flex-wrap:wrap;min-height:26px;align-items:center}
.rp-pow{grid-area:pow;font-family:var(--f-num);font-weight:600;font-size:44px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rp-side.win .rp-pow{color:var(--good)}
.rp-vs{display:flex;align-items:center;gap:10px;justify-content:center;min-height:24px;text-align:center}
.rp-vs span{font-family:var(--f-num);color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.1em}
.rp-msg{font-size:14px;font-weight:500}.rp-msg.tie{color:var(--accent2)}.rp-msg.crack{color:var(--bad)}.rp-msg.good{color:var(--good)}.rp-msg.bad{color:var(--bad)}
.coin{width:22px;height:22px;border-radius:50%;border:2px solid var(--fg2);background:transparent;transition:background .15s,border-color .15s,transform .15s}
.coin.spin{border-color:var(--line2);border-top-color:var(--fg)}
.coin.h{background:var(--accent);border-color:var(--accent)}
.coin.t{background:transparent;border-color:var(--line2)}
.coin.broken{border-color:var(--c-red);background:var(--c-red)}
.coin.gone{height:2px;border:0;border-radius:2px;background:var(--line2);align-self:center}
.rp-pow.bump{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
 .coin.spin{animation:cspin .5s linear infinite}@keyframes cspin{to{transform:rotate(360deg)}}
 .coin.h,.coin.t{animation:cland .2s ease-out}@keyframes cland{from{transform:scale(.6)}to{transform:scale(1)}}
 .coin.broken{animation:cbreak .5s ease-in forwards}@keyframes cbreak{0%{transform:scale(1);opacity:1}40%{transform:scale(1.35);opacity:1}100%{transform:scale(0);opacity:0}}
 .rp-pow.bump{animation:ppop .2s ease-out}@keyframes ppop{from{transform:translateY(-3px)}to{transform:none}}
 .rp-card.shake{animation:shk .3s}@keyframes shk{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
 .log p.new{animation:fi .3s ease-out}@keyframes fi{from{opacity:0}to{opacity:1}}
 .chip.hot{animation:blink 1.4s ease-in-out infinite}@keyframes blink{50%{opacity:.6}}
}
@media (max-width:480px){.rp-pow{font-size:32px;min-width:48px}}
@media (max-width:640px){.top{position:static}.brand small{display:none}.hud-cell.grow{flex-basis:100%}.tabs button{padding:6px 10px;font-size:14px}}

/* v9: 로보토미식 패널 — 각진 모서리, 호박색 외곽선, 모서리 꺾쇠, 비스듬한 제목판 */
:root{--edge:rgba(240,168,48,.38);--edge2:rgba(240,168,48,.7);--r:0px;--r-sm:0px}
.card{border:1px solid var(--edge);border-radius:0;background:linear-gradient(180deg,rgba(20,19,17,.96),rgba(12,12,13,.96))}
.card::before{left:-1px;top:-1px;width:16px;height:16px;background:none;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.card::after{content:"";position:absolute;right:-1px;bottom:-1px;width:16px;height:16px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);pointer-events:none}
.panel h3{display:inline-flex;background:linear-gradient(90deg,rgba(240,168,48,.16),rgba(240,168,48,.04));padding:5px 30px 5px 12px;margin:0 0 10px -6px;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);border-left:3px solid var(--accent)}
.panel h3::before{display:none}
.hud-cell{border:1px solid var(--edge);border-radius:0;background:rgba(14,13,12,.95);position:relative}
.hud-cell::before{content:"";position:absolute;left:-1px;top:-1px;width:8px;height:8px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.hud-cell .ph{border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:2px 12px}
.tabs{background:none;border:0;border-radius:0;padding:0;gap:4px}
.tabs button{border:1px solid var(--edge);border-radius:0;background:rgba(14,13,12,.95);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding:6px 20px}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent)}
.ch{border:1px solid rgba(240,168,48,.22);border-radius:0;background:linear-gradient(180deg,#191816,#131211);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.ch:hover:not(:disabled){border-color:var(--edge2);background:linear-gradient(180deg,#24201a,#171512)}
.ch.prim{border-color:var(--accent)}
.ch.melt{border-color:rgba(239,91,81,.75)}
.grouplbl{color:var(--accent);font-weight:600}
.grouplbl::before{content:"";width:6px;height:6px;background:var(--accent);transform:rotate(45deg)}
.grouplbl::after{background:linear-gradient(90deg,var(--edge),transparent)}
.btn{border-radius:0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding:9px 22px}
.btn.ghost{border:1px solid var(--edge)}
.virt div,.gear div,.npcl div{border-radius:0;border-left:2px solid var(--vc,var(--edge))}
.gr{border-radius:0}
.chip{border-radius:0}
.chip.hot{clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:3px 14px}
.bar,.spbar,.hpbar{border-radius:0}
.bar i{border-radius:0}
.emb{border-radius:0;border:1px solid var(--edge)}
.story{border-radius:0}
.help{border-radius:0;border-left:3px solid var(--accent)}
.unit{border-radius:0;border:1px solid rgba(239,91,81,.45);background:linear-gradient(180deg,#1b1211,#120d0c)}
.ally{border-radius:0;border:1px solid rgba(76,201,207,.35);background:linear-gradient(180deg,#101718,#0c1112)}
.brow{border-radius:0;border-color:var(--edge)}
.rb{border-radius:0}
.ab{border-radius:0;border-color:var(--edge)}
.pref span{border-radius:0}
.fac .card{border-top:1px solid var(--edge)}
.fac h4{border-bottom:1px solid var(--edge);padding-bottom:6px}
.seg button{border-radius:0;border-color:var(--edge)}
.field input{border-radius:0;border-color:var(--edge)}
.rec{border-radius:0;border-color:var(--edge2);position:relative}
.rp-card{border-radius:0;border:1px solid var(--edge2);border-top:2px solid var(--accent);position:relative}
.rp-side{border-radius:0;border-color:var(--edge)}
.rp-btns .btn{padding:5px 14px}
.log .q,.log .seph{border-left-width:3px}

/* v12: 플레이어 패널 · 직원 · 도감 해금 */
.pcard{display:grid;gap:12px}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pc-head h2{margin:2px 0 0;font-size:22px;font-weight:700}
.pc-dept{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--fg2);margin-top:2px}
.pc-dept i{width:9px;height:9px;display:inline-block}
.pc-rank{display:grid;justify-items:center;border:1px solid var(--edge2);padding:4px 12px;min-width:56px;background:rgba(240,168,48,.08)}
.pc-rank b{font-family:var(--f-num);font-size:24px;color:var(--accent);line-height:1.1;font-weight:600}
.pc-rank small{font-size:12.5px;color:var(--fg2)}
.pc-stage{position:relative;height:230px;background:radial-gradient(circle at 50% 45%,rgba(240,168,48,.10),transparent 62%);border:1px solid var(--line)}
.pc-av{position:absolute;left:50%;top:50%;width:118px;height:150px;transform:translate(-50%,-50%);overflow:hidden;display:grid;place-items:end center;border-bottom:1px solid var(--edge)}
.pc-av img{width:100%;height:100%;object-fit:cover}
.gs{position:absolute;transform:translate(-50%,-50%);width:40px;height:26px;display:grid;place-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--line2);background:rgba(12,12,13,.9)}
.gs.on{border:1px solid var(--gc);color:var(--fg);box-shadow:inset 0 0 0 1px var(--gc),0 0 8px color-mix(in srgb,var(--gc) 40%,transparent);font-weight:600}
.pc-bars{display:grid;gap:10px}
.pc-bars.two{grid-template-columns:1fr 1fr;gap:8px}
.pbar{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:baseline;font-size:13.5px;color:var(--fg2)}
.pbar b{justify-self:end;font-family:var(--f-num);font-size:18px;color:var(--fg);font-weight:500}
.pbar b small{font-family:var(--f-ui);font-size:13px;color:var(--muted);font-weight:400}
.pbar .bar,.pbar .spbar{grid-column:1/-1;height:9px}
.pc-eq{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eqt{display:grid;gap:3px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);font-size:14px;min-width:0}

.pc-stats{display:grid;gap:6px}
.ps{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:baseline;font-size:13.5px}
.ps .pn{color:var(--fg2)}.ps .pn::before{content:"";display:inline-block;width:7px;height:7px;background:var(--vc);margin-right:6px;transform:rotate(45deg)}
.ps b{justify-self:end;font-family:var(--f-num);font-size:16px;font-weight:500}
.ps em{font-style:normal;font-family:var(--f-num);color:var(--vc);font-size:14px;min-width:22px;text-align:right}
.ps .pb{grid-column:1/-1;height:4px;background:var(--line2)}.ps .pb i{display:block;height:100%;background:var(--vc)}
.pc-stats.mini4{grid-template-columns:repeat(4,1fr);gap:6px}
.pc-stats.mini4 .ps{grid-template-columns:1fr auto;background:var(--panel);padding:4px 7px}
.pc-stats.mini4 .ps em{display:none}
.staff{grid-template-columns:44px minmax(0,1fr)!important;border-left:3px solid var(--dc)!important}
.sav{width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--edge);font-weight:700;font-size:18px;color:var(--dc)}
.strip{margin:0 0 14px;border:1px solid var(--line);background:var(--panel2);padding:10px 12px;display:grid;gap:5px}
.strip-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.srow{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--fg2);border-bottom:1px dashed var(--line);padding:3px 0}
.srow b{color:var(--fg);font-weight:600;white-space:nowrap}
.srow.hot{color:var(--bad)}.srow.hot b{color:var(--bad)}
.isec{display:grid;gap:5px;padding-top:6px;border-top:1px dashed var(--line)}
.isec>.lbl{font-size:12.5px}
.rb:disabled{opacity:.45;cursor:not-allowed}

/* v13: 팝업 · 토스트 · 눌러서 보는 요소 */
.tap{cursor:pointer;transition:transform .12s,border-color .15s,background .15s,box-shadow .15s}
button.tap{font:inherit;color:inherit;text-align:left}
.tap:hover{border-color:var(--edge2)!important;box-shadow:0 0 0 1px rgba(240,168,48,.25)}
.tap:active{transform:translateY(1px)}
.hud-cell.tap:hover{background:#1c1913}
.pop{position:fixed;inset:0;z-index:40;background:rgba(5,6,7,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.pop-card{position:relative;width:min(520px,100%);max-height:min(86vh,900px);display:flex;flex-direction:column;background:linear-gradient(180deg,#171613,#0f0f10);border:1px solid var(--edge2);box-shadow:0 24px 70px rgba(0,0,0,.6)}

.pop-card::before{content:"";position:absolute;left:-1px;top:-1px;width:18px;height:18px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.pop-card::after{content:"";position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--edge)}
.pop-h h3{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.pop-h h3::before{content:"";width:8px;height:8px;background:var(--accent);transform:rotate(45deg)}
.pop-x{background:none;border:1px solid var(--line2);color:var(--fg2);width:30px;height:30px;cursor:pointer}
.pop-x:hover{border-color:var(--accent);color:var(--fg)}
.pop-b{padding:14px 16px 16px;overflow-y:auto;display:grid;gap:10px}
.pop-b p{margin:0}
.choices.one{grid-template-columns:minmax(0,1fr)}
.ch.static{cursor:default}
.btn.small{padding:6px 14px;font-size:14px}
.bigstat{display:flex;align-items:baseline;gap:12px}
.bigstat b{font-family:var(--f-num);font-size:44px;font-weight:600;color:var(--vc,var(--fg));line-height:1}
.bigstat b small{font-size:18px;color:var(--muted)}
.bigstat span{color:var(--fg2);font-size:14.5px}
.ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px;color:var(--fg2)}
.kvb{padding:10px 12px;background:var(--panel2);border:1px solid var(--line);display:grid;gap:6px}
.res i{font-style:normal;font-size:12px;margin-left:3px}.res i.up{color:var(--good)}.res i.dn{color:var(--bad)}
.gs{cursor:pointer;font:inherit;font-size:12px}
.gs:hover{border-color:var(--accent)!important;color:var(--fg)}
button.pc-av{border:0;border-bottom:1px solid var(--edge);background:none;padding:0;cursor:pointer}
.pc-hint{position:absolute;left:50%;bottom:-1px;transform:translate(-50%,50%);font-size:12px;color:var(--muted);background:var(--panel);padding:0 6px;white-space:nowrap}
.pc-dept.tap{background:none;border:0;padding:0;font-size:13.5px;color:var(--fg2)}
.pc-dept.tap:hover{box-shadow:none;color:var(--accent)}
button.pc-rank{font:inherit;color:inherit}
button.pbar{background:none;border:0;padding:2px 0;width:100%}
button.pbar:hover{box-shadow:none}
button.eqt{text-align:left;position:relative}
.eq-more{font-size:12.5px;color:var(--accent);opacity:.8}
button.ps{background:none;border:0;padding:3px 0;width:100%}
button.ps:hover{box-shadow:none;background:rgba(255,255,255,.03)}
.npcl button{display:flex;justify-content:space-between;gap:6px;background:var(--panel2);padding:6px 10px;border:0;border-left:2px solid var(--edge);width:100%;font-size:14px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acard{display:grid;justify-items:center;gap:5px;padding:12px 8px;background:var(--panel2);border:1px solid var(--line);text-align:center;position:relative}
.acard .an{font-size:14px;font-weight:600;line-height:1.3;min-height:2.6em;display:flex;align-items:center}
.acard.ready{border-color:rgba(240,168,48,.55)}
.acard.ready::after{content:"";position:absolute;right:6px;top:6px;width:7px;height:7px;background:var(--accent);transform:rotate(45deg)}
.obsp{display:flex;gap:3px}.obsp i{width:10px;height:4px;background:var(--line2)}.obsp i.on{background:var(--accent)}
.ape{font-size:12.5px;color:var(--muted)}
.abhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.kpi{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.kpi span{display:grid;font-size:12.5px;color:var(--muted)}.kpi b{font-family:var(--f-num);font-size:18px;color:var(--fg);font-weight:500}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.scard{display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-areas:"av n" "av s" "b b" "b2 b2";gap:2px 10px;align-items:center;padding:10px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--dc)}
.scard .sav{grid-area:av;width:36px;height:36px;font-size:15px}
.scard .sn{grid-area:n;font-size:14.5px}.scard .ss{grid-area:s;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sbars{grid-column:1/-1;height:3px;background:var(--line2);display:block}.scard .sbars i{display:block;height:100%}
.scard.hot{border-color:var(--c-red)}.scard.hot .ss{color:var(--bad)}
.sav.big{width:56px;height:56px;font-size:24px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--edge);font-weight:700;color:var(--dc)}
.srow.tap:hover{box-shadow:none;background:rgba(240,168,48,.05)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:grid;gap:6px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{background:rgba(20,19,17,.97);border:1px solid var(--edge);border-left:3px solid var(--accent);padding:9px 12px;font-size:14px;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.hurt{border-left-color:var(--c-red)}.toast.good{border-left-color:var(--good)}
.toast.out{opacity:0;transform:translateX(12px);transition:opacity .35s,transform .35s}
@media (prefers-reduced-motion:no-preference){.pop-card{animation:popin .16s ease-out}@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}.toast{animation:tin .25s ease-out}@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}}

.facl{display:grid;gap:8px}
.facd{border:1px solid var(--line);border-left:3px solid var(--dc);background:var(--panel2)}
.facd summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px}
.facd summary::-webkit-details-marker{display:none}

.fdot{width:9px;height:9px;background:var(--dc);transform:rotate(45deg)}

.facb p{margin:4px 0 0;font-size:14.5px}
.rl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.rl li{display:grid;gap:1px;font-size:13.5px;color:var(--muted);padding:5px 8px;background:var(--panel);border-left:2px solid var(--line2)}
.rl li b{font-weight:600;color:var(--fg2)}
.rl li.done{border-left-color:var(--good);color:var(--fg2)}.rl li.done b{color:var(--good)}
.gtray{margin-top:10px;border:1px solid var(--line);padding:8px}
.gt-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.gt-h small{color:var(--muted);font-size:12.5px}
.gt-l{display:grid;gap:4px}
.gt{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;font:inherit;color:var(--fg);background:rgba(12,12,13,.6);border:1px dashed var(--line2);border-left:3px solid var(--line2);padding:5px 8px;cursor:pointer}

  good:'노래가 부드러워졌다. 별 하나가 당신 쪽으로 기울었다.',bad:'노래가 귀를 파고든다. 이해하면 안 되는 문장이 있었다.'},
 {id:'lantern',code:'O-04-84',n:'고기 초롱',g:1,dt:'WHITE',cnt:1,fight:'gen',gim:'drain',pref:P(.6,.4,.35,.55),eq:{id:'lanternw',wn:'초롱',wt:'blunt',sin:'gluttony'},slot:'mouth',
  d:['바닥에서 작은 초롱이 피어 있다. 은은한 빛이 따뜻해 보인다.','초롱은 미끼다. 바닥 아래에 그 주인이 있다.','격리가 풀리면 복도 한가운데 초롱이 핀다. 다가간 직원은 바닥째 삼켜진다.'],
  good:'초롱의 빛이 흔들림 없이 고르다.',bad:'바닥이 아주 조금 꺼진 것 같았다.'},
 {id:'ppodae',code:'D-02-107',n:'뽀대',g:1,dt:'RED',cnt:2,fight:'gen',gim:'charge',pref:P(.65,.4,.6,.35),eq:{id:'socute',wn:'귀여워!!!',wt:'slash',sin:'lust'},slot:'cheek',
  d:['복슬복슬한 작은 강아지. 꼬리를 흔든다. 정말로 귀엽다.','귀여움에 방심한 직원은 곧 그 이빨의 크기를 알게 된다.','탈출하면 신나게 뛰어다닌다. 놀아달라는 것이다. 그 놀이는 사람이 버티기 어렵다.'],
  good:'꼬리가 세차게 흔들린다. 당신은 좋은 친구로 기억되었다.',bad:'으르렁. 귀여운 얼굴 아래로 송곳니가 보였다.'},
 {id:'redshoes',code:'O-04-08',n:'빨간 구두',g:2,dt:'RED',cnt:2,fight:'gen',gim:'enrage',pref:P(.45,.35,.55,.5),eq:{id:'sanguine',wn:'핏빛 욕망',wt:'slash',sin:'lust'},slot:'hand',
  d:['붉은 구두 한 켤레가 받침대 위에 놓여 있다. 반짝인다.','신어보고 싶다는 생각이 드는 순간, 이미 늦은 것이다.','구두를 신은 직원은 멈추지 않고 춤춘다. 손에 든 도끼와 함께.'],
  good:'구두가 그저 구두처럼 보인다. 다행이다.',bad:'발이 저절로 한 걸음 앞으로 나갔다.'},
 {id:'machine',code:'O-05-30',n:'노래하는 기계',g:2,dt:'WHITE',cnt:2,pref:P(.4,.55,.35,.5),eq:{id:'harmony',wn:'하모니',wt:'blunt',sin:'sloth'},slot:'brooch',
  d:['낡은 세탁기처럼 생긴 기계. 안에서 아름다운 노래가 흘러나온다.','노래를 위해서는 재료가 필요하다. 기계는 그 재료가 무엇인지 숨기지 않는다.','카운터가 바닥나면 누군가가 홀린 듯 기계 안으로 걸어 들어간다. 노래는 한층 더 아름다워진다.'],
  good:'노래가 조용히 이어진다. 아무도 들어가지 않았다.',bad:'뚜껑이 아주 조금 열렸다. 노래가 당신의 이름을 부르는 것 같았다.'},
 {id:'freischutz',code:'F-01-69',n:'마탄의 사수',g:2,dt:'BLACK',cnt:3,sp:'request',pref:P(.3,.6,0,.45),eq:{id:'bullet',wn:'마탄',wt:'pierce',sin:'pride',wg:3},slot:'hand',
  d:['낡은 장총을 든 사냥꾼이 그림자 속에 서 있다. 연기 냄새가 난다.','그는 반드시 맞히는 탄환을 판다. 값은 언제나 나중에 치른다. 애착 작업 대신 「의뢰」를 할 수 있다.','일곱 번째 탄환은 쏜 사람이 아니라, 그가 원하는 곳으로 날아간다.'],
  good:'사냥꾼이 탄환 한 발을 탁자 위에 굴린다.',bad:'총구가 잠시 당신의 미간을 따라온다. 방아쇠는 당겨지지 않았다.'},
 {id:'butterfly',code:'T-01-68',n:'죽은 나비들의 장례',g:2,dt:'WHITE',cnt:2,fight:'butterfly',pref:P(.35,.6,.55,.45),eq:{id:'lament',wn:'엄숙한 애도',wt:'pierce',sin:'gloom',wg:3},slot:'brooch',
  d:['관을 짊어진 상복 차림의 형체. 머리 대신 나비들이 날아오른다.','그는 죽은 자들을 위해 운다. 이 지부에는 울어줄 이가 없는 죽음이 너무 많다.','격리를 벗어나면 슬픔을 나누어주려 한다. 받은 사람은 그 무게에 가라앉는다.'],
  good:'나비 한 마리가 명찰에 앉았다 날아간다. 이름을 기억해주겠다는 듯이.',bad:'관 속에서 누군가의 이름이 들린다. 아는 이름이다.'},
 {id:'schaden',code:'O-05-76',n:'샤덴프로이데',g:2,dt:'RED',cnt:2,pref:P(.5,.3,.3,.6),eq:{id:'gaze',wn:'시선',wt:'blunt',sin:'envy'},slot:'eye',
  d:['열쇠 구멍이 달린 상자. 구멍 너머에서 무언가가 내다본다.','그것은 보이는 것을 싫어한다. 작업 중에 오래 바라보면 반드시 대가를 치른다.','남의 불행을 엿보는 눈. 들여다보는 자는 언젠가 들여다보인다.'],
  good:'열쇠 구멍이 어두워졌다. 그것이 눈을 감았다.',bad:'구멍 너머의 눈과 마주쳤다.'},
 {id:'porccu',code:'O-02-98',n:'포큐버스',g:2,dt:'BLACK',cnt:2,pref:P(.3,.5,.55,.4),eq:{id:'pleasure',wn:'쾌락',wt:'pierce',sin:'lust'},slot:'cheek',
  d:['가시투성이 작은 생물. 가시 끝에서 달콤한 냄새가 난다.','가시에 찔리면 아프다. 그런데 이상하게, 다시 찔리고 싶어진다.','이 환상체와의 작업 기록에는 "중독"이라는 단어가 자주 등장한다.'],
  good:'가시가 누그러졌다. 따끔한 행복감이 남는다.',bad:'가시에 찔렸다. 아픈데, 웃음이 나왔다.'},
 {id:'queen',code:'O-01-04',n:'증오의 여왕',g:3,dt:'BLACK',cnt:2,fight:'queen',sp:'hero',pref:P(.35,.5,.6,.3),eq:{id:'lovehate',wn:'사랑과 증오의 이름으로',wt:'pierce',sin:'lust'},slot:'hat',
  d:['하트 지팡이를 든 마법소녀. 정의와 사랑을 이야기할 때 눈이 반짝인다.','다른 환상체가 탈출하면 그녀는 정의를 위해 함께 싸우려 한다. 악당이 없는 하루가 길어지면 견디지 못한다.','악당이 사라진 세상에서, 그녀는 스스로 그 빈자리를 채우려 한다.'],
  good:'여왕이 당신을 동료라고 부른다.',bad:'"악당이 어디 있지?" 지팡이 끝이 당신을 향했다가 내려간다.'},
 {id:'bigbird',code:'O-02-40',n:'큰 새',g:3,dt:'BLACK',cnt:5,fight:'bigbird',sp:'bigbird',pref:P(.55,.5,.45,.35),eq:{id:'lamp',wn:'램프',wt:'blunt',sin:'sloth'},slot:'eye',
  d:['수많은 눈을 가진 거대한 새가 등불을 들고 있다.','숲을 지키겠다는 약속 때문에 새는 잠들지 못한다. 시설에서 사람이 죽을 때마다 새의 눈이 하나씩 떠진다.','등불을 오래 바라본 직원은 스스로 부리 안으로 걸어 들어간다.'],
  good:'새의 눈 하나가 천천히 감긴다.',bad:'등불이 흔들린다. 당신은 몇 걸음 앞으로 걸어갔다는 걸 늦게 깨닫는다.'},
 {id:'snow',code:'F-04-42',n:'백설공주의 사과',g:3,dt:'BLACK',cnt:2,fight:'gen',gim:'summon',pref:P(.35,.55,.5,.4),eq:{id:'greenstem',wn:'녹색줄기',wt:'slash',sin:'gloom'},slot:'neck',
  d:['덩굴에 뒤덮인 사과 한 알. 껍질이 썩어 들어가고 있다.','사과는 왕자를 기다린다. 아무도 오지 않는다는 것을 모른 채.','격리가 풀리면 덩굴이 복도를 뒤덮는다. 덩굴에 닿은 것은 함께 썩는다.'],
  good:'덩굴이 잠잠하다. 사과가 조금 덜 썩어 보인다.',bad:'덩굴 하나가 발목을 감았다 풀었다.'},
 {id:'queenbee',code:'T-04-50',n:'여왕벌',g:3,dt:'RED',cnt:2,fight:'gen',gim:'summon',pref:P(.55,.4,.35,.5),eq:{id:'hornet',wn:'호넷',wt:'pierce',sin:'wrath'},slot:'back',
  d:['거대한 벌집 속 여왕이 왕관을 쓰고 있다.','여왕의 포자를 들이마신 직원은 일벌이 된다.','탈출하면 일벌이 끝없이 쏟아져 나온다. 여왕을 쓰러뜨리기 전까지.'],
  good:'날갯소리가 규칙적이다. 벌집이 평화롭다.',bad:'노란 가루가 공기 중에 떠다닌다. 숨을 참았다.'},
 {id:'alriune',code:'T-04-53',n:'알리우네',g:3,dt:'WHITE',cnt:2,fight:'alriune',lim:1,pref:P(.4,.55,.45,.35),eq:{id:'aroma',wn:'잔향',wt:'slash',sin:'gloom'},slot:'neck',
  d:['도자기처럼 매끄러운 분홍빛 형체. 눈이 있어야 할 자리는 비어 있고, 틈마다 꽃이 핀다.','진한 꽃향기가 밖까지 흘러나온다. 향기를 맡은 직원은 꿈꾸듯 졸음에 빠진다.','발밑에 큰 꽃이 필 때마다 무언가가 끝을 향해 다가간다.'],
  good:'꽃잎 하나가 머리 위에 내려앉는다. 머릿속이 맑아진다.',bad:'향기에 눈이 감긴다. 정신을 차렸을 때 꽃밭에 누워 있었다.'},
 {id:'redhood',code:'F-01-57',n:'붉은 두건의 용병',g:3,dt:'RED',cnt:2,fight:'redhood',pref:P(.45,.4,.35,.6),eq:{id:'crimson',wn:'붉은 흉터',wt:'slash',sin:'wrath'},slot:'hat',
  d:['붉은 망토를 두른 사냥꾼. 도끼와 총을 늘 손 닿는 곳에 둔다.','그녀는 늑대를 쫓는다. 의뢰가 있으면 다른 것도 쫓는다.','피 냄새를 따라 움직인다. 상처 입은 직원은 그녀의 시야에서 벗어나기 어렵다.'],
  good:'용병이 당신을 훑고는 코웃음을 친다. 사냥감은 아니라는 뜻이다.',bad:'도끼날이 문틀에 박힌다. 경고였다.'},
 {id:'wolf',code:'F-02-58',n:'커다랗고 나쁠 늑대',g:3,dt:'RED',cnt:2,fight:'gen',gim:'drain',pref:P(.5,.45,.5,.35),eq:{id:'cobalt',wn:'푸른 흉터',wt:'slash',sin:'gluttony'},slot:'mouth',
  d:['푸른 털의 거대한 늑대. 배가 불룩하다.','늑대는 나쁜 늑대가 되기로 했다. 모두가 그러길 원했으니까.','탈출한 늑대는 직원을 통째로 삼킨다. 배를 가르면 아직 살아 있을지도 모른다.'],
  good:'늑대가 하품을 한다. 송곳니가 길다.',bad:'으르렁. "나는 나쁜 늑대야."'},
 {id:'judge',code:'O-02-62',n:'심판 새',g:3,dt:'PALE',cnt:2,fight:'gen',gim:'charge',pref:P(.4,.45,.35,.55),eq:{id:'justitia',wn:'유스티티아',wt:'slash',sin:'pride'},slot:'neck',
  d:['저울을 든 길쭉한 새. 저울의 한쪽 접시가 늘 기울어 있다.','새는 죄를 잰다. 저울은 언제나 유죄 쪽으로 기운다.','격리가 풀리면 저울이 시설 전체를 잰다. 그 판결에 항소는 없다.'],
  good:'저울이 아주 잠깐 수평을 이뤘다.',bad:'저울이 덜컥 기울었다. 목덜미가 서늘하다.'},
 {id:'greed',code:'O-01-64',n:'탐욕의 왕',g:3,dt:'RED',cnt:2,fight:'gen',gim:'charge',pref:P(.55,.35,.5,.4),eq:{id:'goldrush',wn:'골드러시',wt:'blunt',sin:'gluttony'},slot:'hand',
  d:['황금 알 껍질 속에 소녀의 미소가 갇혀 있다.','그녀는 모든 것을 원한다. 원한다는 감정만 남았다.','탈출하면 앞에 있는 모든 것을 삼키며 일직선으로 달린다.'],
  good:'껍질 속 미소가 아주 조금 사람처럼 보였다.',bad:'껍질에 금이 간 줄 알았다. 착각이었다.'},
 {id:'prince',code:'O-04-66',n:'어린 왕자',g:3,dt:'BLACK',cnt:2,pref:P(.4,.5,.6,.35),eq:{id:'spore',wn:'포자',wt:'blunt',sin:'gloom'},slot:'head',
  d:['버섯 포자에 뒤덮인 작은 형체. 장미 한 송이를 쥐고 있다.','어린 왕자는 친구를 원한다. 같은 직원이 계속 찾아오면 그를 특별하게 여긴다.','특별해진 직원은 포자가 된다. 어린 왕자의 영원한 친구로.'],
  good:'왕자가 장미를 조금 내밀었다가 다시 거두었다.',bad:'숨을 들이쉴 때 버섯 냄새가 났다.'},
 {id:'swan',code:'F-02-70',n:'흑조의 꿈',g:3,dt:'WHITE',cnt:2,fight:'gen',gim:'evade',pref:P(.35,.55,.55,.4),eq:{id:'blackswan',wn:'흑조',wt:'blunt',sin:'envy'},slot:'back',
  d:['검은 날개의 소녀가 우산을 들고 있다.','그녀는 오빠들의 저주를 풀기 위해 침묵을 지킨다. 아무도 그녀의 침묵을 들어주지 않았다.','탈출하면 쐐기풀로 짠 옷을 들고 다닌다. 그 옷이 누구를 위한 것인지 아무도 모른다.'],
  good:'소녀가 우산을 조금 기울여 당신을 가려주었다.',bad:'쐐기풀이 손을 스쳤다. 따끔한 침묵.'},
 {id:'current',code:'T-02-71',n:'꿈꾸는 해류',g:3,dt:'WHITE',cnt:2,fight:'gen',gim:'evade',pref:P(.4,.5,.55,.35),eq:{id:'ecstasy',wn:'황홀',wt:'pierce',sin:'lust'},slot:'cheek',
  d:['수조 속 형형색색의 물고기. 놀이공원 음악이 들린다.','그것은 아이들의 꿈을 먹고 자랐다. 꿈속에서는 아무도 아프지 않다.','탈출하면 시설이 바다가 된다. 깨어나지 못하는 직원이 생긴다.'],
  good:'음악이 경쾌하다. 잠깐 웃었다.',bad:'숨이 막힌다. 물속에 있는 것 같았다.'},
 {id:'heaven',code:'O-04-72',n:'파고드는 천국',g:3,dt:'BLACK',cnt:2,fight:'gen',gim:'charge',pref:P(.45,.4,.35,.6),eq:{id:'heavenw',wn:'천국',wt:'pierce',sin:'pride'},slot:'eye',
  d:['나뭇가지가 엉킨 형체. 눈이 셀 수 없이 많다.','그것을 보지 않으면 그것이 다가온다. 그것을 보면, 그것이 당신을 본다.','탈출하면 직원의 시선이 닿지 않는 곳에서 움직인다.'],
  good:'눈들이 일제히 다른 곳을 본다.',bad:'등 뒤에서 나뭇가지가 자라는 소리가 났다.'},
 {id:'knight',code:'O-01-73',n:'절망의 기사',g:3,dt:'WHITE',cnt:2,fight:'knight',lim:1,sp:'bless',pref:P(.3,.45,.6,.35),eq:{id:'tears',wn:'눈물로 벼려낸 검',wt:'slash',sin:'gloom'},slot:'eye',

let G=null, B=null, TAB='work';
const SAVE='lcw_save3';function saveKeyNow(){return (typeof ACT74!=='undefined'&&ACT74)?ACT74.key+'_sav':SAVE}
function lv(v){return v<30?1:v<45?2:v<65?3:v<85?4:5}
function rankOfSt(st){const s=lv(st.F)+lv(st.P)+lv(st.T)+lv(st.J);return s>=16?5:s>=12?4:s>=9?3:s>=6?2:1}
function has(r){return !!(G&&G.res[r])}
function supOn(k){return G&&G.sup&&G.sup.key===k&&!G.sup.done}

function hodPen(){return supOn('train')?(G.mLevel<=2?15:G.mLevel<=4?25:35):0}
function stE(k){return Math.max(1,G.st[k]-hodPen())}
function stEAll(){return {F:stE('F'),P:stE('P'),T:stE('T'),J:stE('J')}}
function rank(){return rankOfSt(stEAll())}
function gift(k){let v=0;for(const s in G.gifts){const a=ABM[G.gifts[s]];if(a&&a.gift.e[k])v+=a.gift.e[k]}return v}

function spResist(){return clamp(1-(stE('P')-15)/180-gift('pr')/100-(G.dept==='welfare'?.1:0)-(has('mind')?.1:0),0.4,1)}

// 할당량: 직원 수와 격리 환상체 수가 늘수록 커진다 (자체 공식, 시뮬레이션으로 조정)

function computeQ(){/* 7+일차/12 회 분량 (45분 단위) */const avg=k=>{const l=deptAbs(k).filter(a=>!a.tool);return l.length?l.reduce((s,a)=>s+[8,10,14,18,24][a.g]*.6,0)/l.length:0};
  // 직원은 격리실 수만큼만 동시에 일할 수 있다 (작업 중인 격리실은 잠김)
  let per=avg(G.dept)*.7;openDepts().forEach(k=>{const n=Math.min(agentsIn(k).length,deptAbs(k).filter(a=>!a.tool).length);per+=n*avg(k)*.5});
  return Math.max(30,Math.round(per*(15.5+G.day/6)))}
function quota(){return G.q||computeQ()}

function openDepts(){return DEPT_ORDER.filter(k=>G.depts[k])}

/* ============ 기록 ============ */
function phaseName(){return {morning:'출근 전',work:'업무 시간',ordeal:'긴급',evening:'퇴근 후',night:'밤'}[G.phase]||''}
function log(text,cls){G.log.push({d:G.day,p:phaseName(),t:text,c:cls||''});if(G.log.length>500)G.log.shift();renderLog(true)}
function addHp(n,why){if(n>0&&supOn('safety'))return;const m=maxHp();G.hp=clamp(Math.round(G.hp+n),0,m);if(n<0&&why)log(`${why} 체력 ${Math.round(n)}.`,'hurt');if(n>0&&why)log(`${why} 체력 +${Math.round(n)}.`,'good')}
function addSp(n,why){if(n>0&&supOn('safety'))return 0;let v=n;if(v<0)v=v*spResist();v=Math.round(v);G.sp=clamp(G.sp+v,-45,45);if(why&&v)log(`${why} 정신력 ${v>=0?'+':''}${v}.`,v<0?'hurt':'good');return v}
function growMul(){return (G.dept==='train'?1.15:1)*(has('edu')?1.15:1)*(G.dept==='arch'?1.1:1)}
function gainStat(k,n){
  const raw=n*growMul();const add=Math.floor(raw)+(chance(raw%1)?1:0);
  const before=rank();G.st[k]=Math.min(130,G.st[k]+add);
  if(rank()>before)log(`승급했다. 이제 ${ROMAN[rank()]}등급 ${RANKNAME[rank()]}이다.`,'warn');return add}
function hum(n){G.hum=clamp(G.hum+n,0,100)}
function rel(k,n){G.rel[k]=clamp(G.rel[k]+n,0,100)}

/* ============ 렌더링 ============ */
function render(){
  if(!G){renderTitle();return}
  if(G.dead||G.ended){renderRecord();return}
  if(!$('#shell')){
    $('#app').innerHTML=`<div id="shell"><header class="top"><div class="top1"><div class="brand">L사 지부 근무일지<small>LOBOTOMY CORP.</small></div><nav class="tabs" role="tablist" id="tabs"></nav></div><div class="daybox" id="daybox"></div></header>
    <div class="wrap"><aside class="side" id="side"></aside><main class="main"><section class="card panel" id="panel"></section><section class="card" id="logcard" style="padding:0"><div class="loghead"><span class="lbl" data-en="LOG">최근 기록</span><button class="btn ghost" id="logmore" style="padding:4px 10px;font-size:12.5px">전체 보기</button></div><div class="log" id="log" aria-live="polite"></div></section><section id="tabview"></section></main></div></div>`;
    $('#logmore').onclick=()=>{const l=$('#log');const big=l.style.maxHeight==='70vh';l.style.maxHeight=big?'':'70vh';$('#logmore').textContent=big?'전체 보기':'접기';renderLog(false)};
  }
  renderTop();renderSide();renderTabs();renderLog(false);
}
function segs(r,n,cls){const on=Math.round(clamp(r,0,1)*n);return `<span class="segbar ${cls||''}">${Array.from({length:n},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</span>`}
function renderTop(){
  const q=quota(),need=gaugeNeed();
  const melts=contained().filter(a=>G.ab[a.id].melt>0).length;
  const sk=G.sup&&!G.sup.done?G.sup.key:null;
  const ot=G.min>1080;
  $('#daybox').innerHTML=`<div class="hud-cell"><span class="hl">DAY</span><b class="big">${String(G.day).padStart(2,'0')}</b><span class="ph">${phaseName()}</span></div>
  <div class="hud-cell"><span class="hl">Time</span><b class="num" style="${ot?'color:var(--c-red)':''}">${clock()}</b><span class="dim">${ot?`초과 ${Math.floor((G.min-1080)/60)}h${(G.min-1080)%60?((G.min-1080)%60)+'m':''}`:'~18:00'}</span></div>
  <div class="hud-cell grow"><span class="hl">Energy</span>${segs(G.pe/q,20,'amber')}<b class="num">${G.pe}<span class="dim">/${q}</span></b></div>
  <div class="hud-cell grow"><span class="hl">Qliphoth Meltdown</span><b class="lvl">LV.${G.mLevel}</b>${segs(G.gauge/need,10,'red')}</div>
  <div class="hud-cell"><span class="hl">LOB</span><b class="num">${G.lob}</b></div>
  ${melts?`<span class="chip hot">${ic('alarm')}폭주 ${melts}</span>`:''}${G.breachQ.length?`<span class="chip hot">${ic('alarm')}탈출 ${G.breachQ.length}</span>`:''}
  ${sk?`<span class="chip acc">${SEPH[sk].n} 코어 억제 · ${supGoal()}</span>`:''}`;
}
function spBar(sp){const w=Math.abs(sp)/45*50;return sp>=0?`<i style="left:50%;width:${w}%;background:var(--sp-pos)"></i>`:`<i style="right:50%;width:${w}%;background:var(--sp-neg)"></i>`}
function spWord(sp){return sp>=30?'평온':sp>=10?'안정':sp>-10?'긴장':sp>-30?'흔들림':'붕괴 직전'}
function resLine(r){return ['RED','WHITE','BLACK','PALE'].map(c=>`<span class="d${c}">${c[0]} ${r[c]}</span>`).join('')}
function renderSide(){
  const r=rank(),m=maxHp(),su=SUIT[G.suit];const pen=hodPen();
  const flags=[];if(G.blessed)flags.push('<span class="chip acc">기사의 축복</span>');if(G.fairyCare)flags.push('<span class="chip">요정의 보살핌</span>');if(G.bullets)flags.push(`<span class="chip">마탄 ${G.bullets}발</span>`);
  const BN={succ:'작업 성공률 +5%',shield:'전투 첫 턴 보호막',help:'다음 작업 +8%'};
  for(const k in G.buff)if(G.buff[k]&&BN[k])flags.push(`<span class="chip">${BN[k]}</span>`);
  const gifts=Object.entries(G.gifts);
  const D=DEPT[G.dept],mates=agentsIn(G.dept);
  $('#side').innerHTML=`<div class="card agent"><div class="lbl" data-en="AGENT">관리직 직원</div><div class="who"><h2>${esc(G.name)}</h2><span class="rank">${ROMAN[r]} ${RANKNAME[r]}</span></div>
  <div class="stat"><div class="row"><span>체력</span><span>${G.hp} / ${m}</span></div><div class="bar"><i style="width:${G.hp/m*100}%"></i></div></div>
  <div class="stat"><div class="row"><span>정신력</span><span>${G.sp>0?'+':''}${G.sp} · ${spWord(G.sp)}</span></div><div class="spbar">${spBar(G.sp)}</div><div class="row" style="color:var(--muted);font-size:11.5px"><span>-45 패닉</span><span>코인 앞면 ${clamp(50+G.sp,5,95)}%</span><span>+45</span></div></div>
  <div class="virt">${Object.keys(VIRT).map(k=>`<div class="v${k}"><span>${VIRT[k]}</span><b>${stE(k)}<em>${ROMAN[lv(stE(k))]}</em></b></div>`).join('')}</div>
  ${pen?`<p class="note" style="color:var(--bad)">호드 억제 중 · 모든 가치관 -${pen}</p>`:''}
  <div class="gear"><div><span>${ic('sword')} 무기</span><span>${weapOf(G.weapon).n} <span class="gr g${weapOf(G.weapon).g}">${GR[weapOf(G.weapon).g]}</span></span></div>
  <div><span>${ic('shield')} 슈트</span><span>${su.n} <span class="gr g${su.g}">${GR[su.g]}</span></span></div><div class="res" style="background:none;padding:0 2px">${resLine(suitR(G.suit))}</div>
  ${gifts.length?gifts.map(([s,id])=>`<div><span>${ic('gift')} ${SLOTN[s]}</span><span>${ABM[id].eq.wn}</span></div>`).join(''):''}</div>
  ${flags.length?`<div class="row" style="margin-top:10px">${flags.join('')}</div>`:''}</div>
  <div class="card dept" style="--dc:${D.col}"><div class="lbl" data-en="DEPT">소속 부서</div><div class="who"><h2 style="font-size:19px">${D.n}</h2><span class="rank" style="color:var(--pale)">${SEPH[G.dept].n}</span></div>
  <div class="note">소속 효과: ${D.bonus}</div>
  <div class="npcl">${mates.length?mates.map(a=>`<div><span>${a.co?'<b>'+a.n+'</b>':a.n} · ${ROMAN[agRank(a)]}</span><span class="code">${a.out?'패닉 이탈':`HP ${a.hp}/${agMax(a)}`}</span></div>`).join(''):'<div class="note">이 부서에 남은 직원이 없다.</div>'}</div>
  <div class="note">격리실 ${deptAbs(G.dept).length}/${D.cap}</div></div>
  <div class="card"><div class="lbl" data-en="BOND">동료와의 유대</div><div class="mini">${Object.keys(CO).map(k=>{const al=coAlive(k);const ag=coAgent(k);return `<span><b>${CO[k].n}</b> · ${ag?DEPT[ag.dept].n:'사무직'} · ${al?`유대 ${G.rel[k]}${G.rel[k]>=80?' ★★':G.rel[k]>=60?' ★':''}`:'<span style="color:var(--bad)">사망</span>'}</span>`}).join('')}<span style="margin-top:6px">마음의 온기 <b>${G.hum}</b></span></div></div>`;
}
function renderTabs(){
  const t=[['work','근무'],['staff','직원'],['fac','시설 · 부서'],['abno','격리실 도감'],['hr','장비 · 인사']];
  $('#tabs').innerHTML=t.map(([id,n])=>`<button role="tab" aria-selected="${TAB===id}" data-tab="${id}">${n}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;renderTabs()});
  const tv=$('#tabview');
  $('#logcard').hidden=TAB!=='work';$('#panel').hidden=TAB!=='work';tv.hidden=TAB==='work';
  if(TAB==='abno'){tv.innerHTML=abnoView();bindAbno()}
  if(TAB==='hr'){tv.innerHTML=hrView();bindHr()}
  if(TAB==='fac'){tv.innerHTML=facView()}
  if(TAB==='staff'){tv.innerHTML=staffView()}
}
function renderLog(append){
  const el=$('#log');if(!el)return;
  const big=el.style.maxHeight==='70vh';
  const items=G.log.slice(big?-300:-40);
  el.innerHTML=items.map((l,i)=>`<p class="${l.c}${append&&i===items.length-1?' new':''}">${['b','bh','npc'].includes(l.c)?'':`<span class="ts">D${String(l.d).padStart(2,'0')} · ${l.p}</span>`}${l.t}</p>`).join('');
  el.scrollTop=el.scrollHeight;
  if(append){renderSide();renderTop()}
}
// choices: {l,s,f,dis,cls,grp,raw}
let CURUI=null;
function setPanel(title,sub,choices,extra,story){
  if(typeof panelPre==='function'){const r=panelPre(title,sub,choices);sub=r.sub;choices=r.choices}
  CURUI=null;const p=$('#panel');
  let html='',lastG=null;
  choices.forEach((c,i)=>{if(c.grp&&c.grp!==lastG){html+=`<div class="lbl grouplbl">${c.grp}</div>`;lastG=c.grp}
    html+=`<button class="ch ${c.cls||''}" data-i="${i}" ${c.dis?'disabled':''}>${c.raw||`<b>${c.l}</b>${c.s?`<small>${c.s}</small>`:''}`}</button>`});
  p.innerHTML=`<h3>${title}</h3>${story?`<div class="story ${story.seph?'seph':''}">${story.spk?`<span class="spk">${story.spk}</span>`:''}${story.t}</div>`:''}${sub?`<p class="sub">${sub}</p>`:''}${extra||''}${html?`<div class="choices">${html}</div>`:''}`;
  p.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const c=choices[+b.dataset.i];if(c.dis)return;c.f()});
  if(TAB!=='work'){TAB='work';renderTabs()}
}

/* ============ 시설 탭 ============ */
function facView(){
  return `<div class="card panel"><h3>시설 현황</h3><p class="sub">부서는 일차에 따라 순서대로 열린다. 연구는 하루에 한 번, 열린 부서 중 하나에서 진행할 수 있다 (근무 중 일반 업무 또는 퇴근 후).</p>
  <div class="fac">${DEPT_ORDER.map(k=>{const D=DEPT[k],o=G.depts[k];const ags=G.agents.filter(a=>a.dept===k);
    return `<div class="card ${o?'':'locked'}" style="--dc:${D.col}"><h4><span>${D.n} <span class="code">${D.layer}</span></span><span style="color:var(--pale)">${SEPH[k].n}</span></h4>
    ${o?`<div class="note">개방 D${o.day} · 격리실 ${deptAbs(k).length}/${D.cap} · 소속 효과: ${D.bonus}${G.supDone[k]?' · <b style="color:var(--good)">코어 억제 완료</b>':''}</div>
    <div class="npcl" style="margin-top:6px">${deptAbs(k).map(a=>`<div><span>${a.n} <span class="gr g${a.g}">${GR[a.g]}</span></span><span class="dots">${cntDots(a)}</span></div>`).join('')||'<div class="note">환상체 없음</div>'}</div>
    <div class="npcl" style="margin-top:6px">${ags.map(a=>`<div class="${a.alive?'':'dead'}"><span>${a.n} · ${ROMAN[agRank(a)]}</span><span class="code">${a.alive?(a.out?'이탈':`HP ${a.hp}`):'사망'}</span></div>`).join('')}</div>
    <div class="note" style="margin-top:6px">연구: ${D.res.map(r=>`${G.res[r[0]]?'✔':'·'} ${r[1]}`).join(' / ')}</div>`:'<div class="note">아직 열리지 않았다.</div>'}</div>`}).join('')}</div></div>`;
}

/* ============ 도감 / 장비 ============ */
function prefWord(p){return p>=.7?'높음':p>=.5?'보통':p>=.35?'낮음':'최저'}
function infoHidden(){return supOn('info')}
function cntDots(a){if(a.tool)return '—';const s=G.ab[a.id];if(infoHidden())return '▒▒';return (a.breach||s.obs>=2||has('gov'))?`<span class="qc">${Array.from({length:a.cnt},(_,i)=>`<i class="${i<s.cnt?'on':''}"></i>`).join('')}</span>`:'?'}
function egoNames(a){const s=G.ab[a.id];return {suit:s.obs>=2?`「${a.eq.wn}」`:'「???」',weap:s.obs>=3?`「${a.eq.wn}」`:'「???」'}}
function abnoView(){
  const list=contained();
  return `<div class="card"><div class="lbl" style="margin-bottom:8px">격리 중인 환상체 ${list.length} · 관찰 단계가 오를수록 정보가 열린다 (Ⅰ 선호 · Ⅱ 슈트·기프트 · Ⅲ 무기)</div><div class="abl">${list.map(a=>{const s=G.ab[a.id];const en=egoNames(a);
  if(a.tool)return `<div class="ab">${emblem(a,true)}<div class="body"><header><h4>${a.n} <span class="gr g${a.g}">${GR[a.g]}</span> <span class="chip">도구형</span></h4><span class="code">${a.code} · ${DEPT[s.dept].n}</span></header><p>${a.d.slice(0,Math.min(s.obs+2,3)).join(' ')}</p><div class="note">사용: ${a.use}</div></div></div>`;
  return `<div class="ab">${emblem(a,true)}<div class="body"><header><h4>${a.n} <span class="gr g${a.g}">${GR[a.g]}</span>${a.lim?' <span class="chip">림버스 전투 반영</span>':''}${a.ur?' <span class="chip">미등장·구버전</span>':''}</h4><span class="code">${abHidden(a)?'':a.code+' · '}${DEPT[s.dept].n} · ${dmgIc(a.dt)} <span class="dt d${a.dt}">${a.dt}</span> · 관찰 ${ROMAN[s.obs]}</span></header>
  <p>${a.d.slice(0,Math.min(s.obs+1,3)).join(' ')}</p>
  ${s.obs>=1?`<div class="pref">${WORKS.map(w=>`<span>${ic(w.id)} ${w.n} · ${a.sp==='request'&&w.id==='att'?'의뢰':prefWord(prefOf(a,w.id))}</span>`).join('')}</div>`:'<p class="note">작업 선호도: 관찰 Ⅰ에서 공개</p>'}
  <div class="row" style="font-size:13px;color:var(--fg2)"><span>카운터 <span class="dots">${cntDots(a)}</span></span><span>PE 재고 ${s.pe}</span><span>작업 ${s.works}회</span>${s.obs>=2?`<span>${a.breach?'탈출 가능':'탈출하지 않음'}</span>`:''}</div>
  <div class="note">E.G.O 슈트 ${en.suit} ${COST.suit[a.g]} PE (관찰 Ⅱ) · 무기 ${en.weap} ${COST.weap[a.g]} PE (관찰 Ⅲ) · 기프트 ${SLOTN[a.slot]}: ${s.obs>=2?a.gift.d:'관찰 Ⅱ에서 공개'}</div>
  <div class="imgset">${userImg(a.id)?'내 이미지 사용 중 · <label><input type="file" accept="image/*" data-img="'+a.id+'">바꾸기</label> · <label data-noimg="'+a.id+'">지우기</label>':'<label><input type="file" accept="image/*" data-img="'+a.id+'">내 이미지 넣기</label> (이 브라우저에만 저장)'}</div></div></div>`}).join('')}</div></div>`;
}
function bindAbno(){
  document.querySelectorAll('[data-img]').forEach(i=>i.onchange=()=>{if(i.files[0])setUserImg(i.dataset.img,i.files[0])});
  document.querySelectorAll('[data-noimg]').forEach(l=>l.onclick=()=>{try{localStorage.removeItem('lcw_img_'+l.dataset.noimg)}catch(e){};renderTabs()});
}
function canEquip(g){return rank()>=Math.max(1,g)}
function egoCost(kind,a){return Math.round(COST[kind][a.g]*(has('egocost')?.75:1))}
function extList(){const ext=[];contained().forEach(a=>{if(a.tool)return;const s=G.ab[a.id];
  if(!G.ownS.includes(a.eq.id)&&s.obs>=2)ext.push({kind:'suit',a,cost:egoCost('suit',a),ok:s.pe>=egoCost('suit',a)});
  if(!G.ownW.includes(a.eq.id)&&s.obs>=3)ext.push({kind:'weap',a,cost:egoCost('weap',a),ok:s.pe>=egoCost('weap',a)})});return ext}
function hrView(){
  const lock=!!B;const ext=extList();
  return `<div class="card panel"><h3>장비 장착</h3><p class="sub">무기는 전투 스킬을, 슈트는 RED/WHITE/BLACK/PALE 피해 배율을 바꾼다. 직원 등급이 장비 등급보다 낮으면 장착할 수 없다 (TETH Ⅰ · HE Ⅱ · WAW Ⅲ · ALEPH Ⅳ). 추출한 장비는 동료들도 등급에 맞춰 나눠 쓴다.</p>
  <div class="lbl grouplbl">무기</div><div class="choices">${G.ownW.map(id=>{const w=weapOf(id);return `<button class="ch" data-eqw="${id}" ${G.weapon===id||lock||!canEquip(w.g)?'disabled':''}><b>${ic('sword')} ${w.n} <span class="gr g${w.g}">${GR[w.g]}</span></b><small>${G.weapon===id?'장착 중':canEquip(w.g)?'장착하기':'등급 부족'} · ${dmgIc(w.dc)} ${w.dc}${w.ego?' · E.G.O 스킬':''}<br>${w.skills.map(s=>s.n).join(' / ')}</small></button>`}).join('')}</div>
  <div class="lbl grouplbl" style="margin-top:12px">슈트</div><div class="choices">${G.ownS.map(id=>{const s=suitOf(id);return `<button class="ch" data-eqs="${id}" ${G.suit===id||lock||!canEquip(s.g)?'disabled':''}><b>${ic('shield')} ${s.n} <span class="gr g${s.g}">${GR[s.g]}</span></b><small><span class="res">${resLine(suitR(id))}</span>${G.suit===id?'장착 중':canEquip(s.g)?'장착하기':'등급 부족'}</small></button>`}).join('')}</div></div>
  <div class="card panel" style="margin-top:12px"><h3>E.G.O 추출</h3><p class="sub">관찰 Ⅱ에 슈트, Ⅲ에 무기의 이름과 추출이 열린다. 비용은 그 환상체에게서 모은 PE 재고. 기프트는 추출할 수 없고, 관찰 Ⅱ 이상인 환상체와 작업을 마칠 때 낮은 확률로 받는다.</p>
  <div class="choices">${ext.length?ext.map((x,i)=>{const s=G.ab[x.a.id];return `<button class="ch" data-ex="${i}" ${x.ok&&!lock?'':'disabled'}><b>${x.kind==='suit'?ic('shield'):ic('sword')} ${x.a.eq.wn} ${egoGr(x)}</b><small>${x.a.n} · ${x.kind==='suit'?'슈트':'무기'} · PE ${s.pe}/${x.cost}</small></button>`}).join(''):'<p class="note">이름이 밝혀진 장비가 없다. 관찰 단계를 올려야 한다.</p>'}</div></div>
  <div class="card panel" style="margin-top:12px"><h3>인사 · 능력치</h3><p class="sub">LOB 1점으로 가치관 +1. 정의는 2점이 든다. 보유 ${G.lob}점.</p>
  <div class="choices">${Object.keys(VIRT).map(k=>{const c=k==='J'?2:1;return `<button class="ch" data-up="${k}" ${G.lob<c||lock?'disabled':''}><b>${VIRT[k]} +1</b><small>${c} LOB · 현재 ${G.st[k]}</small></button>`}).join('')}</div></div>`;
}

const ACQ_TOOL=[4,9,14,19,29,34,39,44],ACQ_NONE=[5,10,20,25,30,35,40,45,50],ACQ_TWO=[21,23,46,47,48,49],ACQ_MIX=[22,24];
function acqPlan(d){if(ACQ_NONE.includes(d))return [];if(ACQ_MIX.includes(d))return ['n','t'];if(ACQ_TOOL.includes(d))return ['t'];if(ACQ_TWO.includes(d))return ['n','n'];return ['n']}
function pickAbnoStep(next){
  if(G.flags['picked'+G.day])return next();

  if(!freeDept()){log('격리실 여유가 없어 오늘은 새 환상체가 배정되지 않았다.','sys');return next()}
  let n=0;
  const one=()=>{if(n>=plan.length||!freeDept())return next();const kind=plan[n++];
    const w=riskW(G.day);const maxG=w.reduce((m,v,i)=>v>0?i:m,0);
    const ok=a=>!G.ab[a.id].dept&&a.id!=='onesin'&&!a.nopick&&!(a.id==='army'&&G.day>=11&&G.day<=13);

    if(pool.length<3)pool=pool.concat(AB.filter(a=>ok(a)&&(kind==='t'?a.tool:!a.tool)&&!pool.includes(a)));

    setPanel(kind==='t'?'오늘의 도구형 환상체 선택':'오늘의 환상체 선택',`관리자 단말에 오늘 수용할 환상체 후보 ${cand.length}개가 떴다. 관리자가 현장 직원의 의견을 묻는다. 배치될 곳: ${DEPT[freeDept()].n}.${plan.length>1?` (오늘 ${n}/${plan.length})`:''}`,

}

function succRate(a,w){
  const p=prefOf(a,w.id)+stE('T')*0.002+G.sp/45*0.1+(G.dept==='info'?.03:0)+gift('succ')/100+(G.buff.succ?.05:0)+(G.buff.help?.08:0)+(has('succ5')?.05:0)+(has('arch1')?.03:0)+((G.ab[a.id].obs||0)>=1?.04:0)+((G.ab[a.id].obs||0)>=3?.04:0)-(rank()<a.g?0.08*(a.g-rank()):0);
  return clamp(p,.05,.95);
}
function workLabel(a,w,i){

}

function fearCheck(grade){

  const tbl=[[.10,'긴장'],[.30,'공포'],[.60,'절망'],[1,'압도']];

  log(`[${r[1]}] 공포 피해.`,'warn');
  const m=has('manual')?.5:1;
  if(r[0]>=1&&m===1){G.sp=-45;log('정신이 하얗게 비어버린다.','hurt')}else addSp(-Math.round(90*r[0]*m),'두려움에');
  return diff;
}

function workDamage(a,amt){
  const r=suitR(G.suit);let m=r[a.dt]*gradeMul(a.g-SUIT[G.suit].g)*(G.blessed?.85:1)*(has('norm')?.9:1)*(has('dmg10')?.9:1)*(G.supDone.welfare?.9:1)*(supOn('welfare')&&G.sup.col===a.dt?(G.mLevel>=4?1.75:1.5):1)*(G.buff.portrait?.75:1);
  const d=amt*m;
  if(a.dt==='RED')addHp(-d,'공격을 받아');
  else if(a.dt==='WHITE')addSp(-d*.8,'정신을 할퀴는 무언가에');
  else if(a.dt==='BLACK'){addHp(-d*.6,'BLACK 피해로');addSp(-d*.4)}
  else addHp(-Math.round(d*.9),'영혼을 긁는 피해로');

function finishWork(a,w,m){

    else{log('조용히 문을 닫고 나왔다. 아무것도 얻지 못했고, 아무것도 잃지 않았다.','sys');s.melt=pm}
    return afterWork(a);
  }
  s.works++;s.lastDay=G.day;
  if(a.id==='teddy'&&G.lastWork==='teddy'){log('테디가 당신을 안았다. 놓아주지 않는다. 뼈가 삐걱거린다.','hurt');addHp(-Math.round(maxHp()*.6));if(G.hp<=0)return die('행복한 테디의 포옹')}

  log(res==='bad'?a.bad:a.good,'q');

  if(a.id==='galaxy'&&res==='good')addSp(6,'아이가 준 조약돌을 쥐고');
  if(a.id==='cherry'&&res==='good')addSp(5,'꽃잎 아래에서');
  if(a.id==='welch'&&res!=='bad'){addHp(6);addSp(4,'톡 쏘는 한 모금에')}

  if(a.id==='parasite'){if(res==='good')addSp(6,'꽃향기에');else if(res==='bad')addHp(-8,'뿌리가 파고들어')}

  if(m.sp)addSp(m.sp);if(m.hp)addHp(m.hp);if(m.hum)hum(m.hum);

  go();
}

  setPanel('E.G.O 기프트',`${SLOTN[a.slot]} 부위에 이미 「${ABM[cur].eq.wn}」 기프트가 있다. 한 부위에는 하나만 남는다.`,[
    {l:'새 기프트로 바꾼다',s:`${a.n}: ${a.gift.d}`,f:()=>{G.gifts[a.slot]=a.id;G.hp=Math.min(G.hp,maxHp());log('기프트가 바뀌었다.','good');next()}},
    {l:'지금 기프트를 유지한다',s:`${ABM[cur].n}: ${ABM[cur].gift.d} · 새 기프트는 보관함에 남아 나중에 바꿔 낄 수 있다`,f:next}]);
}

/* ============ 시간 경과 · 동료 자율 관리 ============ */
/* ============ 시계: 하루 24시간 · 09:00 출근 · 18:00 퇴근 (자체 설계) ============ */
const T_START=540,T_END=1080,T_FORCE=1980;
function clock(m){m=m??G.min;const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;return `${d?'+1일 ':''}${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`}
function overtime(){return G.min>T_END}
// 작업 소요 시간: ZAYIN 30 · TETH 40 · HE 50 · WAW 60 · ALEPH 80분
function workMin(a){const o=(G.ab[a.id]&&G.ab[a.id].obs)||0;return Math.round([30,40,50,60,80][a.g]*(1-(o>=2?.1:0)-(o>=4?.1:0)))}
function act(skipId,next,mins){tick(skipId,mins??G.pendDur??30);G.pendDur=null;proceed(next)}
function forceNextDay(){
  log(`다음 날 오전 9시. 끝내 퇴근하지 못한 채 새 근무일이 밝았다.`,'hurt');
  if(G.sup&&!G.sup.done){G.supPend.unshift(G.sup.key);G.sup=null}
  if(G.pe>=quota()){G.lob+=1;log(`할당량은 채웠다 (${G.pe}/${quota()}). LOB +1.`,'good')}else log(`할당량 미달 (${G.pe}/${quota()}). 할당량 보상 없음.`,'hurt');
  G.forced=true;addSp(-10,'한숨도 못 자서');endDay();
}
function proceed(next){
  if(G.dead)return;
  if(G.hp<=0)return die('패닉에 빠진 동료의 습격');
  if(G.min>=T_FORCE)return forceNextDay();
  save();
  if(G.breachQ.length)return emergency(next);
  next();
}
function tick(skipId,mins){
  if(G.tt2armed){G.tt2armed=false;G.peMark=G.pe;log('TT2: 시설의 시간이 멈춰 있는 동안 일을 마쳤다. (시간 경과 없음)','sys');return}
  const m=Math.max(1,mins||30);const prev=G.min;G.min=Math.min(T_FORCE,G.min+m);
  if(prev<T_END&&G.min>=T_END)log('오후 6시. 정규 근무 시간이 끝났다.'+(G.pe<quota()?' 할당량을 채우기 전에는 퇴근할 수 없다. 지금부터는 초과 근무다.':''),'warn');
  // 동료 작업은 45분마다 한 차례
  agentSim(m,skipId);
  G.gauge+=Math.max(0,G.pe-(G.peMark||0))+Math.round(gaugeNeed()*.04*m/45);G.peMark=G.pe;
  for(const a of contained()){const s=G.ab[a.id];if(s.melt>0&&a.id!==skipId){s.melt=Math.max(0,s.melt-m);if(s.melt===0)meltFail(a)}}
  // 초과 근무: 20분마다 정신력 -1 (누적 계산), 초과 5시간마다 LOB +1
  if(G.min<=T_END)G.otAcc=0;
  if(G.min>T_END){const otm=G.min-Math.max(T_END,prev);if(otm>0){G.otAcc=(G.otAcc||0)+otm;const n=Math.floor(G.otAcc/20);if(n){G.otAcc-=n*20;addSp(-n,'초과 근무의 피로로')}}
    const tot=Math.floor((G.min-T_END)/300);if(tot>(G.otLob||0)){G.lob+=tot-(G.otLob||0);G.otLob=tot;log(`초과 근무 ${tot*5}시간 · LOB +1`,'good')}}
  if(G.supDone.safety){G.hp=Math.min(maxHp(),G.hp+2);G.sp=Math.min(45,G.sp+1)}
  if(G.buff.bracelet){if(G.hp>=maxHp()){G.brFull=(G.brFull||0)+1;if(G.brFull===2)log('발광 팔찌가 뜨거워진다. 고칠 상처가 없다.','warn');if(G.brFull>=3){G.brFull=0;G.hp=1;addSp(-15);log('발광 팔찌가 과열되었다. 고칠 상처를 직접 만들어냈다. (원작: 즉사 → 체력 1)','hurt')}}else G.brFull=0}
  let guard=0;while(G.gauge>=gaugeNeed()&&guard++<3){G.gauge-=gaugeNeed();levelUp()}
  if(guard>=3)G.gauge=Math.min(G.gauge,gaugeNeed()-1);
}
function npcPhase(){
  let n=0,pe=0;const notes=[];
  for(const ag of G.agents){
    if(!ag.alive||ag.out)continue;
    ag.hp=Math.min(agMax(ag),ag.hp+Math.round(agMax(ag)*.05));ag.sp=Math.min(45,ag.sp+4);
    const abs=deptAbs(ag.dept).filter(a=>!a.tool);if(!abs.length)continue;
    if(ag.hp<agMax(ag)*.4&&!abs.some(a=>G.ab[a.id].melt>0))continue;
    const melting=abs.filter(a=>G.ab[a.id].melt>0);
    let tgt=null;
    if(melting.length&&chance(.6))tgt=pick(melting);else if(chance(.25))tgt=pick(abs);
    if(!tgt)continue;
    const r=npcWork(ag,tgt);n++;pe+=r.pe;if(r.note)notes.push(r.note);
  }
  if(n)log(`동료 작업 ${n}건 · 에너지 +${pe} PE`,'npc');
  notes.forEach(t=>log(t,'npc'));
}
function npcWork(ag,a){
  const s=G.ab[a.id];const r=agRank(ag);
  const works=WORKS.filter(w=>!(a.sp==='request'&&w.id==='att'));
  const kn=works.filter(x=>favKnown(a,x.id));const w=kn.length&&(kn.length===works.length||chance(.6))?kn.slice().sort((x,y)=>prefOf(a,y.id)-prefOf(a,x.id))[0]:pick(works);
  const p=clamp(prefOf(a,w.id)+ag.st.T*.002+(ag.sp/45)*.1-(r<a.g?.08*(a.g-r):0),.05,.95);
  const boxes=[8,10,14,18,24][a.g];let succ=0;for(let i=0;i<boxes;i++)if(chance(p))succ++;
  const ratio=succ/boxes,res=ratio>=.7?'good':ratio>=.4?'normal':'bad';
  G.pe+=succ;G.peTotal+=succ;s.pe+=Math.round(succ*.6);s.works++;s.lastDay=G.day;
  if(a.id==='plague'&&res!=='bad'&&chance(.2))bless(ag.n);
  let note=null;
  if(s.melt>0){s.melt=0;note=`${ag.n}이(가) ${a.n}의 폭주를 진정시켰다.`}
  // 공포·피해
  const diff=a.g+1-r;if(diff>0)ag.sp-=[0,5,12,25,45][Math.min(diff,4)];
  const fail=boxes-succ;
  if(fail>0){const su=suitOf(agSuit(ag));const d=[1,1.4,2,2.8,4][a.g]*fail*.8*su.r[a.dt]*gradeMul(a.g-su.g);
    if(a.dt==='WHITE')ag.sp-=Math.round(d*.8);else if(a.dt==='BLACK'){ag.hp-=Math.round(d*.6);ag.sp-=Math.round(d*.4)}else ag.hp-=Math.round(d)}
  const gf=clamp(1+((a.g+1)-r)*.5,.15,2);if(chance(.5*gf))ag.st[w.v]+=1;
  if(res==='bad'){s.cnt=Math.max(0,s.cnt-1);if(!note)note=`${ag.n}의 ${a.n} 작업 결과가 나쁘다. 카운터 감소.`}
  if(a.id==='freischutz'&&(lv(ag.st.J)<3||res==='normal'))s.cnt=Math.max(0,s.cnt-1);
  if(ag.hp<=0){agentDie(ag,`${a.n} 작업 중`);note=null}
  else if(ag.sp<=-45){startPanic(ag)}
  if(s.cnt<=0)counterZero(a,'npc');
  return {pe:succ,note};
}
function agentHurt(ag,amt,why){ag.hp-=amt;if(ag.hp<=0)agentDie(ag,why)}
function agentDie(ag,why){
  if(!ag.alive)return;
  if(ag.task&&ag.task.ab&&G.ab[ag.task.ab]&&G.ab[ag.task.ab].busy===ag.id)G.ab[ag.task.ab].busy=null;
  ag.alive=false;G.deaths++;
  log(`${ag.n}(${DEPT[ag.dept].n}) 사망 — ${why}.`,'hurt');
  if(ag.co){G.grief.push(ag.co);hum(-3);addSp(-10)}
  else if(ag.dept===G.dept)addSp(-4);
}
function meltFail(a){
  const loss=Math.round(5*G.mLevel*(G.sup&&!G.sup.done?.5:1));G.pe=Math.max(0,G.pe-loss);
  log(`${a.n}의 클리포트 폭주를 막지 못했다. 에너지 ${loss} 손실. 카운터가 바닥났다.`,'hurt');

}

    log(`경보. ${a.n}(${DEPT[s.dept].n})의 클리포트 카운터가 0이 되었다. 격리 실패.`,'warn');return;

function levelUp(){
  if(G.mLevel<10)G.mLevel++;
  log(`클리포트 폭주 레벨 ${G.mLevel}. 경보가 울린다.`,'warn');
  if(supOn('safety')){if(G.mLevel>=4){G.hp=Math.max(G.hp,Math.round(maxHp()*.6));G.sp=Math.max(G.sp,15);log('네짜흐 억제: 폭주 레벨 상승 — 체력 60%·정신력 15까지만 회복된다.','warn')}else{G.hp=maxHp();G.sp=45;log('네짜흐 억제: 폭주 레벨 상승으로 완전히 회복했다.','good')}}
  if(supOn('welfare')){G.sup.col=pick(['RED','WHITE','BLACK','PALE']);log(`헤세드 억제: 이제 ${G.sup.col} 피해가 ${G.mLevel>=4?1.75:1.5}배로 아프다.`,'warn')}
  if((supOn('disc')||supOn('extract'))&&G.mLevel===3&&!G.sup.boss){G.sup.boss=1;G.breachQ.push({type:'boss',key:G.sup.key});log(supOn('disc')?'복도 끝에서 붉은 안개가 피어오른다. 게부라가 검을 뽑았다.':'조율자가 나타났다. 공기가 무거워진다.','warn')}
  // 시련 일정 (원작): 여명 6일 · 정오 11일 · 어스름 21일 · 자정 26일부터. 46일부터 백색 시련.
  const L=G.mLevel,d=G.day;let tier=null;
  if(L===2&&d>=6)tier='dawn';else if(L===4&&d>=11)tier='noon';else if(L===6&&d>=21)tier='dusk';else if(L===8&&d>=26)tier='midnight';
  // 원작: 46~49일은 백색 시련만 (46 여명 · 47 정오 · 48 어스름 · 49 자정)
  if(d>=46&&d<=49){tier=null;const W={46:[2,'dawn'],47:[4,'noon'],48:[6,'dusk'],49:[8,'midnight']}[d];if(L===W[0])tier='white_'+W[1]}else if(d>=50)tier=null;
  if(tier&&!G.ordToday[tier]){G.ordToday[tier]=1;G.breachQ.push({type:'ordeal',tier});}
  const pool=contained().filter(a=>!a.tool&&G.ab[a.id].melt===0);
  const n=Math.min(pool.length,(1+Math.floor(L/3))*(supOn('central')?2:1));
  const chosen=shuffle(pool).slice(0,n);chosen.forEach(a=>{G.ab[a.id].melt=120+(G.dept==='central'?30:0)});
  if(n)log(`클리포트 폭주 발생: ${chosen.map(a=>`${a.n}(${DEPT[G.ab[a.id].dept].n})`).join(', ')}. 시간이 다 가기 전에 누군가 작업해야 한다.`,'warn');
}

function ordealOf(e){

function threatOf(e){if(e.type==='ab')return [2,3.5,6,9,15][ABM[e.id].g];if(e.type==='ordeal')return ordealOf(e).thr*(e.col==='white'?1.3:1);return 99}
function teamFor(e){const d=e.type==='ab'?G.ab[e.id].dept:null;
  return G.agents.filter(a=>a.alive&&!a.out&&!a.panic).sort((x,y)=>((y.dept===d)-(x.dept===d))||agRank(y)-agRank(x)).slice(0,3)}
function teamPow(t){return t.reduce((s,a)=>s+agRank(a)+.5+(agWeap(a)!=='baton'&&agWeap(a)!=='fixer'?.5:0),0)}
function delegP(e){const t=teamFor(e);if(!t.length)return .05;return clamp(.5+(teamPow(t)-threatOf(e))*.07+(has('rabbit')?.25:0),.08,.95)}
function eTitle(e){if(e.type==='ab'){const a=ABM[e.id];return `${a.n} 탈출 <span class="gr g${a.g}">${GR[a.g]}</span>`}if(e.type==='ordeal'){const o=ordealOf(e);return `${COLN[e.col]} ${o.n}의 시련`}return e.key==='disc'?'붉은 안개 (게부라)':'조율자 (비나)'}
function emergency(next){
  G.phase='ordeal';render();
  const ch=[];
  G.breachQ.forEach((e,i)=>{
    const grp=eTitle(e).replace(/<[^>]+>/g,'');
    const t=teamFor(e);
    ch.push({grp:`긴급 ${i+1} · ${grp}`,cls:'melt',raw:`<b>${ic('sword')} 직접 출동한다</b><small>${eTitle(e)} · 동행: ${battleMates(e).map(a=>a.n).join(', ')||'없음'}</small>`,f:()=>sortie(i,next)});
    if(e.type!=='boss')ch.push({grp:`긴급 ${i+1} · ${grp}`,raw:`<b>${ic('help')} 다른 직원들에게 맡긴다</b><small>진압 예상 ${Math.round(delegP(e)*100)}% · 투입: ${t.map(a=>a.n+' '+ROMAN[agRank(a)]).join(', ')||'남은 직원 없음'} · 실패하면 희생자가 나오고 에너지를 잃는다</small>`,f:()=>delegate(i,next)});
  });
  setPanel('긴급 상황',`${G.breachQ.length}건. 각각 직접 출동할지, 다른 직원들에게 맡길지 고른다. 하나를 처리하면 다음 건으로 넘어간다.`,ch,'',{t:pick(['경보음이 복도를 채운다. 붉은 조명이 깜빡인다.','엔젤라의 방송: "격리 실패 발생. 가까운 직원은 진압에 협조해 주십시오."','발소리가 한쪽 방향으로 몰려간다. 반대쪽으로 가는 사람도 있다.'])});
}
function emergencyNext(next){if(G.dead)return;if(G.min>=T_FORCE)return forceNextDay();save();if(G.breachQ.length)return emergency(next);G.phase='work';next()}
function delegate(i,next){
  const e=G.breachQ.splice(i,1)[0];const t=teamFor(e);const p=delegP(e);
  if(chance(p)){
    const v=pick(t);if(v){agentHurt(v,Math.round(agMax(v)*R(15,40)/100),'진압 중 부상')}
    log(`${eTitle(e).replace(/<[^>]+>/g,'')} — ${t.map(a=>a.n).join(', ')}이(가) 진압했다.`,'good');
    if(e.type==='ordeal'){const pe=Math.round(quota()*ordealOf(e).rw*.5);G.pe+=pe;log(`시련 진압 보상 에너지 +${pe}.`,'good')}
  }else{
    const v=pick(t);if(v)agentDie(v,`${eTitle(e).replace(/<[^>]+>/g,'')} 진압 중`);
    const loss=5*G.mLevel;G.pe=Math.max(0,G.pe-loss);hum(-2);
    log(`진압이 늦어졌다. 결국 막아냈지만 희생이 있었다. 에너지 ${loss} 손실.`,'hurt');
  }
  tick(null,10);
  emergencyNext(next);
}
function battleMates(e){
  const d=e.type==='ab'?G.ab[e.id].dept:null;
  const pool=G.agents.filter(a=>a.alive&&!a.out&&!a.panic&&(a.dept===G.dept||a.dept===d)).sort((x,y)=>((y.dept===G.dept)-(x.dept===G.dept))||(!!y.co-!!x.co)||agRank(y)-agRank(x));
  return pool.slice(0,2+(has('call')?1:0));
}
function sortie(i,next){
  const e=G.breachQ.splice(i,1)[0];const mates=battleMates(e);const back=()=>{if(G.dead)return;const t=G.lastBattleTurns||3;log(`진압에 ${15+5*t}분이 걸렸다.`,'sys');tick(null,15+5*t);emergencyNext(next)};
  if(e.type==='ab'){const a=ABM[e.id];return startBattle(a.fight==='gen'?'gen':a.fight,{grade:a.g,title:`제압 · ${a.n}`,ab:a.id,mates,after:back})}
  if(e.type==='ordeal'){const o=ordealOf(e);log(`${COLN[e.col]} ${o.n}의 시련이 복도에 나타났다.`,'warn');fearCheck(o.g-1);
    const go=()=>startBattle('ordeal',{grade:o.g,title:`${COLN[e.col]} ${o.n}`,col:e.col,tier:e.tk,ordeal:true,rw:o.rw,mates,after:back});if(G.sp<=-45)return panicFlow(go);return go()}
  startBattle(e.key==='disc'?'redmist':'arbiter',{grade:4,title:e.key==='disc'?'코어 억제 · 붉은 안개':'코어 억제 · 조율자',boss:e.key,mates,after:()=>{if(G.sup&&!G.sup.done&&G.sup.key===e.key)return supClear(back);back()}});
}

  if(G.blessed){G.blessed=false;G.ab.knight.cnt=0;log('멀리서 검이 뽑히는 소리가 들린다. 가호를 받은 자가 무너졌다.','warn');if(G.ab.knight.dept)counterZero(ABM.knight,'bless')}

  const opts=[{l:'숨을 센다',s:`지혜로 버틴다 · 성공률 ${Math.round((.3+stE('P')/200+bonus)*100)}%`,f:()=>resolvePanic(chance(.3+stE('P')/200+bonus),'숨을 세는 동안 세계가 다시 제자리를 찾았다.',next)}];
  const cands=Object.keys(CO).filter(k=>coAlive(k)).sort((a,b)=>G.rel[b]-G.rel[a]);
  if(cands.length){const best=cands[0];const p=.25+G.rel[best]/150+bonus+(best==='mira'&&G.flags.bond_mira_2?.2:0);opts.push({l:`${CO[best].n}을(를) 부른다`,s:`유대 ${G.rel[best]} · 성공률 ${Math.round(Math.min(.95,p)*100)}%`,f:()=>resolvePanic(chance(p),`${CO[best].n}이(가) 당신의 이름을 불렀다. 그 목소리를 붙잡고 올라왔다.`,next,best)})}

function resolvePanic(ok,txt,next,who){
  if(ok){G.sp=-15;log(txt,'good');if(who){rel(who,5);hum(3)}}

    log('누군가가 WHITE 무기로 당신을 때려 정신을 되돌렸다. 로보토미의 표준 절차다.','hurt');G.hp=Math.max(0,G.hp-18);G.sp=-25;
    if(G.hp<=0)return die('패닉 제압 중 사망');

function endDay(){
  G.phase='night';
  disposePanicked();
  // 늦게 퇴근할수록 잠이 줄어 회복이 줄어든다. 강제로 날이 바뀌면 회복 없음.
  const sleep=G.forced?0:(G.min>=1440?.5:G.min>=1320?.75:1);G.forced=false;
  if(sleep<1&&sleep>0)log('늦게 퇴근해서 잠이 부족하다. 회복량이 줄었다.','hurt');
  G.sp=clamp(Math.round(G.sp*0.5+5*sleep),-45,45);
  const r=(G.dept==='safety'?1.3:1);
  G.hp=Math.min(maxHp(),G.hp+Math.round(maxHp()*.35*r*sleep));
  G.agents.forEach(a=>{if(a.alive)for(const k in a.st)a.st[k]+=chance(.7)?1:0});
  if(G.day>=50)return ending();
  G.day++;save();
  log(`— DAY ${G.day} —`,'sys');
  startDay(false);
}

// --- 도감 정보 해금 (영문 위키 각 환상체 문서의 PE 박스 비용을 위험 등급별 대표값으로 정리) ---
// 기본 정보 / 탈출 정보: ZAYIN 8 · TETH 12 · HE 16 · WAW 20 · ALEPH 30
// 작업 선호(작업별): 2 · 4 · 5 · 7 · 10   관리 방법(항목별): 4 · 4 · 6 · 10 · 6
const INFOC={b:[8,12,16,20,30],f:[2,4,5,7,10],m:[4,4,6,10,6],e:[8,12,16,20,30]};
function infoOf(a){const s=G.ab[a.id];if(!s.info){s.info={b:0,f:{ins:0,insi:0,att:0,rep:0},m:[0,0],e:0};if(a.tool){s.info.f={ins:1,insi:1,att:1,rep:1};s.info.e=1}
  if(s.obs>0){const o=s.obs;s.info.b=1;if(o>=2)s.info.f={ins:1,insi:1,att:1,rep:1};if(o>=3)s.info.m=[1,1];if(o>=4)s.info.e=1}}return s.info}
function obsLv(a){const i=infoOf(a);return (i.b?1:0)+(Object.values(i.f).every(Boolean)?1:0)+(i.m.every(Boolean)?1:0)+(i.e?1:0)}
function infoCost(a,k){return Math.max(1,Math.round(INFOC[k][a.g]*(G.dept==='record'?.75:1)*(has('obsf')||G.supDone.record?.75:1)))}
const OBSB=['','작업 성공률 +4%','작업 시간 -10%','작업 성공률 +4%','작업 시간 -10%'];
function refreshObs(a){const s=G.ab[a.id];const b=s.obs||0;s.obs=obsLv(a);if(s.obs>b)log(`${a.n} 관찰 레벨 ${ROMAN[s.obs]} · ${OBSB[s.obs]}${s.obs>=2?' · E.G.O 기프트 가능':''}`,'good')}
function favKnown(a,wid){return has('gov')||!!infoOf(a).f[wid]}
function unlockInfo(a,k,sub){const i=infoOf(a),s=G.ab[a.id];const c=infoCost(a,k==='f'?'f':k==='m'?'m':k);
  if(s.pe<c)return false;s.pe-=c;
  if(k==='b'){i.b=1;log(`기본 정보를 해금했다: ${a._n}. (PE ${c})`,'good')}
  else if(k==='f'){i.f[sub]=1;log(`${a.n} · ${WORKS.find(w=>w.id===sub).n} 작업 선호를 해금했다. (PE ${c})`,'good')}
  else if(k==='m'){i.m[sub]=1;log(`${a.n} · 관리 방법 ${sub+1}을(를) 해금했다. (PE ${c})`,'good')}
  else {i.e=1;log(`${a.n} · 탈출 정보를 해금했다. (PE ${c})`,'good')}
  refreshObs(a);save();return true}
// 보고서·전투 등에서 얻는 무료 정보 (작업 반복으로는 열리지 않음)
function obsGain(a,n){const i=infoOf(a);let k=Math.floor(n)+(chance(n%1)?1:0);
  while(k-->0){const locked=[];if(!i.b)locked.push(()=>i.b=1);WORKS.forEach(w=>{if(!i.f[w.id])locked.push(()=>i.f[w.id]=1)});i.m.forEach((v,j)=>{if(!v)locked.push(()=>i.m[j]=1)});if(!i.e)locked.push(()=>i.e=1);
    if(!locked.length)break;(i.b?pick(locked):locked[0])();}
  refreshObs(a)}
