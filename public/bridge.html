<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<link rel="icon" href="data:,"><title>L사 본사 근무일지</title>
<style>body{margin:0;background:#12181a;color:#dfe7e4;font:15px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{max-width:520px;padding:24px 18px}h1{font-size:19px;color:#f4ee9a;margin:0 0 10px}p{margin:8px 0}.mu{color:#8fa19c;font-size:13px}
a,button{display:inline-block;margin:10px 8px 0 0;padding:9px 16px;border:1px solid #f4ee9a;background:#1b2225;color:#f4ee9a;text-decoration:none;font:inherit;cursor:pointer}</style></head>
<body><main><h1 id="h">L사 본사 근무일지</h1><p id="m">…</p><p class="mu" id="s"></p><div id="b"></div></main>
<script>
/* 이사 중 다리 페이지 (Vercel 전용 · 1회 요청): 이 주소(브라우저)에 남은 기록을 새 주소로 옮겨 주고 보낸다 */
(async function(){
var DEST='https://lcorp-rpg.pages.dev/';
var L=(navigator.language||'ko').slice(0,2),T=function(k,e,j){return L==='ja'?j:L==='en'?e:k};
var $=function(i){return document.getElementById(i)};
$('m').textContent=T('게임이 새 주소로 이사했다. 이 기기에 남은 기록을 챙겨 옮기는 중이다…','The game has moved to a new address. Bringing your saved progress along…','ゲームは新しいアドレスへ引っ越した。この端末の記録を移している…');
var o={},n=0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('lcw')===0){o[k]=localStorage.getItem(k);n++}}}catch(e){}
if(!n){location.replace(DEST);return}
var json=JSON.stringify({v:1,t:Date.now(),o:o}),b64;
try{var st=new Blob([new TextEncoder().encode(json)]).stream().pipeThrough(new CompressionStream('deflate-raw'));var u=new Uint8Array(await new Response(st).arrayBuffer());var s='';for(var j=0;j<u.length;j+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(j,j+0x8000));b64='1'+btoa(s)}
catch(e){b64='0'+btoa(unescape(encodeURIComponent(json)))}
b64=b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
var url=DEST+'#lcwx='+b64;
var file=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['LCWX:'+b64],{type:'text/plain'}));a.download='lcorp-backup.txt';document.body.appendChild(a);a.click()};
$('b').innerHTML='<a id="g" href="'+DEST+'">'+T('새 주소로 가기','Go to the new address','新しいアドレスへ')+'</a><button id="f" type="button">'+T('백업 파일 받기','Download backup file','バックアップファイルを保存')+'</button>';
$('f').onclick=file;
if(url.length<1800000){$('s').textContent=T('잠시 뒤 자동으로 넘어간다. 기록은 이 기기에도 그대로 남는다.','You will be redirected shortly. Your data also stays on this device.','まもなく自動で移動する。記録はこの端末にも残る。');$('g').href=url;setTimeout(function(){location.replace(url)},800)}
else $('s').textContent=T('기록이 커서 자동으로 옮기지 못했다. [백업 파일 받기] 후 새 주소의 타이틀 화면에서 [옛 주소 백업 넣기]로 불러온다.','Your data is too large to move automatically. Download the backup file, then load it with [Load old-address backup] on the title screen of the new address.','記録が大きく自動で移せなかった。[バックアップファイルを保存]後、新しいアドレスのタイトル画面の[旧アドレスのバックアップを入れる]で読み込む。');
})();
</script></body></html>
