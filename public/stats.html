<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>운영 통계</title>
<style>
:root{--bg:#12181a;--pn:#1a2326;--pn2:#152024;--ln:#2c3a3e;--tx:#dfe7e4;--mu:#8fa19c;--ac:#e8b04a;--ok:#5fc48a;--wn:#e8b04a;--bad:#ff5a4f;
 --c1:#4fa3e0;--c2:#e8b04a;--c3:#5fc48a;--c4:#c77dff;--c5:#ff7a6b;--c6:#7fd8d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 2px}h2{font-size:15px;margin:26px 0 8px;color:var(--ac);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}h2 small{color:var(--mu);font-weight:400;font-size:12px}
.mu{color:var(--mu);font-size:12.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input,select,button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:7px 10px}
input[type=date]{color-scheme:dark}
button{cursor:pointer;background:#2a3a3f}button:hover{border-color:var(--ac)}button.on{border-color:var(--ac);color:var(--ac)}
#key{min-width:200px;flex:1 1 200px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
.card b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.card span{color:var(--mu);font-size:12px}
.card em{font-style:normal;font-size:11.5px;margin-left:4px}.up{color:var(--ok)}.dn{color:var(--bad)}
.lim{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.lim .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gauge{height:10px;background:#0c1113;border-radius:5px;overflow:hidden;margin:6px 0 2px;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--ok)}.gauge i.p{background:rgba(255,255,255,.18)}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:8px;max-height:460px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}th{background:var(--pn);color:var(--mu);font-weight:600;position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
.ch{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 10px 6px;position:relative}
.ch h3{margin:0 0 4px;font-size:13px;font-weight:600}
.ch svg{display:block;width:100%;height:auto}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:2px 0 4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.err{color:var(--bad)}a{color:var(--c1)}ul{margin:4px 0;padding-left:18px}
.tip{position:fixed;pointer-events:none;background:#0b1012;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;font-size:12px;z-index:9;display:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.hb{display:grid;grid-template-columns:minmax(80px,40%) 1fr auto;gap:6px 8px;align-items:center;font-size:12.5px}
.hb i{display:block;height:10px;border-radius:3px;background:var(--c1)}.hb span:last-child{color:var(--mu);font-variant-numeric:tabular-nums}
.note{background:var(--pn2);border:1px dashed var(--ln);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12.5px;color:var(--mu)}
</style></head><body><main>
<h1>운영 통계</h1>
<div class="mu">한국 시간 기준 · 개인 식별 정보 없이 집계 (방문자 번호는 기기마다 무작위로 만든 값) · 통계는 100일 뒤 자동 삭제</div>
<div class="bar"><input id="key" type="password" placeholder="STATS_KEY 입력" autocomplete="current-password"></div>
<div class="bar">
  <label class="mu">시작 <input id="from" type="date"></label>
  <label class="mu">끝 <input id="to" type="date"></label>
  <span id="pre"></span>
  <label class="mu"><input id="cmp" type="checkbox" checked> 직전 같은 기간과 비교</label>
  <button id="go">불러오기</button><button id="csv" title="일별 표를 CSV로 받기">CSV</button>
</div>
<div id="msg" class="mu"></div>
<div id="out"></div>
<div class="tip" id="tip"></div>
</main>
<script>
const PAGE_GZ=1426738;              // 게임 페이지 한 번 받을 때 전송량(압축 기준, 바이트) — 지금 버전
const LIMITS={inv:1e6,fdt:100e9,cmd:5e5,ubw:10e9};
const $=s=>document.querySelector(s);
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const N=n=>Math.round(n).toLocaleString('ko-KR');
const B=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':b>=1e3?(b/1e3).toFixed(0)+' KB':Math.round(b)+' B';
const H=s=>s>=3600?(s/3600).toFixed(1)+'시간':Math.round(s/60)+'분';
const P=x=>(x*100).toFixed(1)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(h,k)=>+(h&&h[k])||0;
const sum=(rows,fn)=>rows.reduce((a,r)=>a+fn(r),0);
const kday=(t=Date.now())=>new Date(t+9*3600e3).toISOString().slice(0,10);
const addD=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*86400e3).toISOString().slice(0,10);
const span=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/86400e3)+1;
let LAST=null;

/* ---------- 기간 고르기 ---------- */
const today=kday(),oldest=addD(today,-99);
['from','to'].forEach(id=>{$('#'+id).min=oldest;$('#'+id).max=today});
$('#to').value=ls.g('lcw_st_to')&&ls.g('lcw_st_to')<=today?ls.g('lcw_st_to'):today;
$('#from').value=ls.g('lcw_st_from')&&ls.g('lcw_st_from')>=oldest?ls.g('lcw_st_from'):addD(today,-30);
const PRE=[['7일',()=>[addD(today,-6),today]],['14일',()=>[addD(today,-13),today]],['30일',()=>[addD(today,-29),today]],['60일',()=>[addD(today,-59),today]],['100일',()=>[oldest,today]],
 ['이번 달',()=>[today.slice(0,8)+'01',today]],['지난달',()=>{const d=new Date(Date.parse(today.slice(0,8)+'01T00:00:00Z')-86400e3).toISOString().slice(0,10);return [d.slice(0,8)+'01',d]}]];
$('#pre').innerHTML=PRE.map((p,i)=>`<button type="button" data-p="${i}">${p[0]}</button>`).join(' ');
$('#pre').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const [a,c]=PRE[+b.dataset.p][1]();$('#from').value=a<oldest?oldest:a;$('#to').value=c;load()};
$('#key').value=ls.g('lcw_stats_key')||'';
$('#go').onclick=load;$('#key').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
$('#csv').onclick=()=>{if(!LAST)return;const D=LAST.days;const head=['날짜','방문','고유','로그인','플레이 인원','플레이(초)','저장','저장 바이트','가입','모바일','컴퓨터','설치 앱','예상 전송(바이트)'];
 const rows=D.map(r=>[r.d,f(r.h,'v'),r.u,f(r.h,'vl'),r.pu,f(r.h,'p'),f(r.h,'un'),f(r.h,'ub'),f(r.h,'su'),f(r.h,'dv:m'),f(r.h,'dv:d'),f(r.h,'ap:app'),Math.round(est(r.h))]);
 const t='﻿'+[head,...rows].map(x=>x.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=`stats_${LAST.from}_${LAST.to}.csv`;a.click()};
if($('#key').value)load();

async function get(k,from,to){const r=await fetch(`/api/stats?from=${from}&to=${to}`,{headers:{'x-stats-key':k}});const j=await r.json().catch(()=>({}));return [r,j]}
async function load(){const k=$('#key').value.trim();if(!k){$('#msg').textContent='키를 입력해 주세요.';return}
  let from=$('#from').value,to=$('#to').value;if(!from||!to){$('#msg').textContent='기간을 골라 주세요.';return}if(from>to)[from,to]=[to,from];
  ls.s('lcw_st_from',from);ls.s('lcw_st_to',to);$('#msg').textContent='불러오는 중…';
  try{const [r,j]=await get(k,from,to);
    if(!r.ok){const m={auth:'키가 맞지 않습니다.',nokey:'Vercel 환경 변수 STATS_KEY(8자 이상)가 아직 없습니다. 추가한 뒤 다시 배포해 주세요.',nodb:'저장소(Upstash Redis)가 연결되어 있지 않습니다.','too-many':'잘못된 키 시도가 많아 15분 동안 막혔습니다.'}[j.code]||('오류 '+r.status);
      $('#msg').innerHTML='<span class="err">'+m+'</span>';return}
    ls.s('lcw_stats_key',k);let prev=null;
    if($("#cmp").checked&&j.days.length){const n=span(j.from,j.to),pt=addD(j.from,-1),pf=addD(pt,-(n-1));if(pt>=j.oldest){const [r2,j2]=await get(k,pf<j.oldest?j.oldest:pf,pt);if(r2.ok)prev=j2}}
    LAST=j;$('#msg').textContent=`${j.from} ~ ${j.to} (${j.days.length}일) · 갱신 ${new Date().toLocaleString('ko-KR')}`+(j.from!==from?` · 통계는 ${j.oldest}부터만 남아 있습니다`:'');draw(j,prev)}
  catch(e){console.error(e);$('#msg').innerHTML='<span class="err">서버에 연결하지 못했습니다.</span>'}}

/* ---------- 계산 ---------- */
// 하루 예상 전송량: 방문 1회 = 게임 페이지 1번(압축) + 서버 저장 올림·내림
const est=h=>f(h,'v')*PAGE_GZ+f(h,'ub')*2;
function tot(j){const D=j.days;const o={v:sum(D,r=>f(r.h,'v')),vl:sum(D,r=>f(r.h,'vl')),p:sum(D,r=>f(r.h,'p')),pud:sum(D,r=>r.pu),un:sum(D,r=>f(r.h,'un')),ub:sum(D,r=>f(r.h,'ub')),su:sum(D,r=>f(r.h,'su')),u:j.rangeU,pu:j.rangePU,n:D.length};
 o.app=sum(D,r=>f(r.h,'ap:app'));o.mo=sum(D,r=>f(r.h,'dv:m'));o.dv=o.mo+sum(D,r=>f(r.h,'dv:d'));o.ap=o.app+sum(D,r=>f(r.h,'ap:web'));o.fdt=sum(D,r=>est(r.h));return o}
function agg(D,pre){const o={};D.forEach(r=>{for(const k in r.h)if(k.startsWith(pre)){const n=k.slice(pre.length);o[n]=(o[n]||0)+f(r.h,k)}});return o}

/* ---------- 그래프 도구 (SVG) ---------- */
const TIP=$('#tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-t]');if(!t){TIP.style.display='none';return}TIP.innerHTML=t.dataset.t;TIP.style.display='block';
 const w=TIP.offsetWidth;TIP.style.left=Math.min(innerWidth-w-8,e.clientX+12)+'px';TIP.style.top=(e.clientY+14)+'px'});
function axis(W,Hh,L,R,T,Bm,max,fmt,labels){let g='';for(let i=0;i<=4;i++){const y=T+(Hh-T-Bm)*(1-i/4);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#2c3a3e" stroke-width="1"/><text x="${L-6}" y="${y+4}" fill="#8fa19c" font-size="11" text-anchor="end">${fmt(max*i/4)}</text>`}
 const n=labels.length,step=Math.ceil(n/12),bw=(W-L-R)/n;labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${L+bw*i+bw/2}" y="${Hh-Bm+16}" fill="#8fa19c" font-size="11" text-anchor="middle">${esc(l)}</text>`});return g}
/* 막대 + 선 겹쳐 그리기: series=[{n,c,v:[...],type:'bar'|'line',fmt,axis:'r'?}] */
function chart(title,labels,series,opt={}){const W=opt.w||1000,Hh=opt.h||240,L=56,R=series.some(s=>s.axis==='r')?56:14,T=10,Bm=26;const n=labels.length||1;const bw=(W-L-R)/n;
 const left=series.filter(s=>s.axis!=='r'),right=series.filter(s=>s.axis==='r');
 const mx=a=>Math.max(1e-9,...a.flatMap(s=>s.stack?s.v.map((x,i)=>a.filter(z=>z.stack).reduce((q,z)=>q+(z.v[i]||0),0)):s.v));
 const mL=mx(left)*1.08,mR=right.length?mx(right)*1.08:1;const y=(v,m)=>T+(Hh-T-Bm)*(1-v/m);
 let g=axis(W,Hh,L,R,T,Bm,mL,left[0]?.fmt||N,labels);
 if(right.length)for(let i=0;i<=4;i++){const yy=T+(Hh-T-Bm)*(1-i/4);g+=`<text x="${W-R+6}" y="${yy+4}" fill="#8fa19c" font-size="11">${(right[0].fmt||N)(mR*i/4)}</text>`}
 const bars=series.filter(s=>s.type==='bar'&&!s.stack),stk=series.filter(s=>s.stack),nb=bars.length+(stk.length?1:0);let bi=0;
 bars.forEach(s=>{const m=s.axis==='r'?mR:mL;s.v.forEach((v,i)=>{const x=L+bw*i+bw*.12+bi*(bw*.76/nb),w=Math.max(1,bw*.76/nb-1),yy=y(v,m);g+=`<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,Hh-Bm-yy)}" fill="${s.c}" rx="1" data-t="${esc(labels[i])}<br>${esc(s.n)}: <b>${(s.fmt||N)(v)}</b>"/>`});bi++});
 if(stk.length){labels.forEach((l,i)=>{let base=0;stk.forEach(s=>{const v=s.v[i]||0;const x=L+bw*i+bw*.12+bi*(bw*.76/nb),w=Math.max(1,bw*.76/nb-1),y1=y(base+v,mL),y0=y(base,mL);g+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0,y0-y1)}" fill="${s.c}" data-t="${esc(l)}<br>${esc(s.n)}: <b>${(s.fmt||N)(v)}</b>"/>`;base+=v})})}
 series.filter(s=>s.type==='line').forEach(s=>{const m=s.axis==='r'?mR:mL;const pts=s.v.map((v,i)=>[L+bw*i+bw/2,y(v,m)]);
  g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${n>60?2:3}" fill="${s.c}" data-t="${esc(labels[i])}<br>${esc(s.n)}: <b>${(s.fmt||N)(s.v[i])}</b>"/>`})});
 (opt.hlines||[]).forEach(hl=>{const m=hl.axis==='r'?mR:mL;if(hl.v>m)return;const yy=y(hl.v,m);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${hl.c}" stroke-dasharray="6 4"/><text x="${W-R-4}" y="${yy-4}" fill="${hl.c}" font-size="11" text-anchor="end">${esc(hl.n)}</text>`});
 const lg=series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('');
 return `<div class="ch"><h3>${esc(title)}</h3><div class="lg">${lg}</div><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(title)}">${g}</svg>${opt.note?`<div class="mu">${opt.note}</div>`:''}</div>`}
function hbars(title,obj,opt={}){const e=Object.entries(obj).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,opt.top||12);const T=Object.values(obj).reduce((a,b)=>a+b,0)||1;const m=e.length?e[0][1]:1;
 return `<div class="ch"><h3>${esc(title)}</h3>${e.length?`<div class="hb">${e.map(([k,v],i)=>`<span>${esc(opt.name?opt.name(k):k)}</span><i style="width:${Math.max(2,v/m*100)}%;background:${opt.c||'var(--c1)'}" data-t="${esc(opt.name?opt.name(k):k)}: <b>${N(v)}</b> (${P(v/T)})"></i><span>${N(v)} · ${P(v/T)}</span>`).join('')}</div>`:'<div class="mu">아직 모인 자료가 없습니다.</div>'}${opt.note?`<div class="mu" style="margin-top:6px">${opt.note}</div>`:''}</div>`}
function pie(title,parts){const T=parts.reduce((a,p)=>a+p[1],0);if(!T)return `<div class="ch"><h3>${esc(title)}</h3><div class="mu">아직 모인 자료가 없습니다.</div></div>`;
 let a=-Math.PI/2,g='';parts.forEach(([n,v,c])=>{if(!v)return;const b=a+v/T*Math.PI*2;const big=b-a>Math.PI?1:0;const p=(t,r)=>[100+r*Math.cos(t),100+r*Math.sin(t)];const [x1,y1]=p(a,90),[x2,y2]=p(b,90),[x3,y3]=p(b,52),[x4,y4]=p(a,52);
  g+=v===T?`<circle cx="100" cy="100" r="71" fill="none" stroke="${c}" stroke-width="38" data-t="${esc(n)}: <b>${N(v)}</b> (100%)"/>`:`<path d="M${x1},${y1} A90,90 0 ${big} 1 ${x2},${y2} L${x3},${y3} A52,52 0 ${big} 0 ${x4},${y4}Z" fill="${c}" data-t="${esc(n)}: <b>${N(v)}</b> (${P(v/T)})"/>`;a=b});
 return `<div class="ch"><h3>${esc(title)}</h3><div style="display:flex;gap:12px;align-items:center"><svg viewBox="0 0 200 200" style="max-width:150px">${g}</svg><div class="lg" style="flex-direction:column">${parts.map(([n,v,c])=>`<span><i style="background:${c}"></i>${esc(n)} · ${N(v)} (${P(v/T)})</span>`).join('')}</div></div></div>`}

/* ---------- 그리기 ---------- */
function draw(j,prev){const D=j.days,L=D.map(r=>r.d.slice(5)),t=tot(j),pt=prev?tot(prev):null;
 const dl=(a,b,inv)=>{if(b==null||!isFinite(b)||b===0)return '';const x=(a-b)/b;const good=inv?x<0:x>0;return `<em class="${Math.abs(x)<.005?'':good?'up':'dn'}">${x>=0?'▲':'▼'}${Math.abs(x*100).toFixed(0)}%</em>`};
 const C=(val,label,cur,pv,inv)=>`<div class="card"><b>${val}${pt?dl(cur,pv,inv):''}</b><span>${label}</span></div>`;
 let h=`<h2>선택 기간 요약 <small>${j.from} ~ ${j.to} · ${t.n}일${pt?` · ▲▼는 직전 ${pt.n}일(${prev.from} ~ ${prev.to})과 비교`:''}</small></h2><div class="cards">`+[
  C(N(t.v),'방문',t.v,pt&&pt.v),C(N(t.u),'고유 방문자',t.u,pt&&pt.u),C(N(t.pu),'플레이한 사람',t.pu,pt&&pt.pu),C(H(t.p),'총 플레이 시간',t.p,pt&&pt.p),
  C(t.pud?H(t.p/t.pud):'-','1인 하루 평균 플레이',t.pud?t.p/t.pud:0,pt&&pt.pud?pt.p/pt.pud:null),C(t.u?(t.v/t.u).toFixed(1)+'회':'-','1인 평균 방문',t.u?t.v/t.u:0,pt&&pt.u?pt.v/pt.u:null),
  C(N(t.v/t.n),'하루 평균 방문',t.v/t.n,pt&&pt.v/pt.n),C(t.v?P(t.vl/t.v):'-','로그인 상태 방문',t.v?t.vl/t.v:0,pt&&pt.v?pt.vl/pt.v:null),
  C(N(t.su),'신규 가입',t.su,pt&&pt.su),C(N(t.un),'서버 저장',t.un,pt&&pt.un),C(B(t.ub),'저장 용량',t.ub,pt&&pt.ub,true),
  C(t.dv?P(t.mo/t.dv):'-','모바일 비율',t.dv?t.mo/t.dv:0,pt&&pt.dv?pt.mo/pt.dv:null),C(t.ap?P(t.app/t.ap):'-','설치한 앱으로 접속',t.ap?t.app/t.ap:0,pt&&pt.ap?pt.app/pt.ap:null),
  C(B(t.fdt),'예상 전송량 (Vercel)',t.fdt,pt&&pt.fdt,true),C(N(j.keys),'저장소 키 수')
 ].join('')+'</div>';
 /* 무료 한도 (이번 달) */
 const M=j.mdays||[],Mo=M.map(r=>({h:r.h}));const [Y,Mn,Dd]=j.today.split('-').map(Number);const dim=new Date(Y,Mn,0).getDate();const proj=dim/Dd;
 const mv=sum(Mo,r=>f(r.h,'v')),mvl=sum(Mo,r=>f(r.h,'vl')),mun=sum(Mo,r=>f(r.h,'un')),mub=sum(Mo,r=>f(r.h,'ub')),mpu=0;
 const inv=mv*2+mvl+mun,fdt=sum(Mo,r=>est(r.h)),cmd=mv*7+mvl*5+mun*4+M.length*2,ubw=mub*2+mvl*(mun?mub/mun:0);
 h+=`<h2>무료 한도 대비 <small>이번 달 ${j.month} · ${Dd}일째 · 회색 = 월말 예상</small></h2>`+[
  ['Vercel 함수 호출 (Function Invocations)',inv,LIMITS.inv,N],['Vercel 전송량 (Fast Data Transfer)',fdt,LIMITS.fdt,B],['Upstash 명령 수 (Commands)',cmd,LIMITS.cmd,N],['Upstash 전송량 (Bandwidth)',ubw,LIMITS.ubw,B]
 ].map(([tt,x,Lm,fm])=>{const pr=x*proj,pc=x/Lm*100,pp=Math.min(100,pr/Lm*100);const col=pp>=90?'var(--bad)':pp>=60?'var(--wn)':'var(--ok)';
  return `<div class="lim"><div class="t"><span>${tt}</span><span class="mu">${fm(x)} / ${fm(Lm)} (${pc.toFixed(1)}%) · 월말 예상 ${fm(pr)} (${pp.toFixed(1)}%)</span></div><div class="gauge"><i class="p" style="width:${pp}%"></i><i style="width:${Math.min(100,pc)}%;background:${col}"></i></div></div>`}).join('')+
  `<div class="note">추정치는 이 사이트가 직접 센 방문·저장 횟수로 계산합니다. Vercel 전송량은 <b>방문 × 지금 게임 페이지 크기(${B(PAGE_GZ)})</b>로 어림하므로, 페이지가 더 컸던 지난 버전 기간은 실제보다 적게 나옵니다. 정확한 값은 <a href="https://vercel.com/dashboard" target="_blank" rel="noopener">Vercel 대시보드 → Usage</a>와 <a href="https://console.upstash.com/" target="_blank" rel="noopener">Upstash 콘솔</a>에서 확인해 주세요.</div>`;
 /* 일별 그래프 */
 const v=D.map(r=>f(r.h,'v')),u=D.map(r=>r.u),pu=D.map(r=>r.pu),p=D.map(r=>f(r.h,'p')),pav=D.map(r=>r.pu?f(r.h,'p')/r.pu:0);
 const ma=a=>a.map((x,i)=>{const s=a.slice(Math.max(0,i-6),i+1);return s.reduce((q,z)=>q+z,0)/s.length});
 h+=`<h2>일별 추이</h2>`+chart('방문 · 고유 방문자 · 플레이한 사람',L,[{n:'방문',c:'var(--c1)',v,type:'bar'},{n:'고유 방문자',c:'var(--c2)',v:u,type:'line'},{n:'플레이한 사람',c:'var(--c3)',v:pu,type:'line'},{n:'방문 7일 평균',c:'#ffffff88',v:ma(v),type:'line',dash:1}]);

  chart('로그인 · 저장',L,[{n:'서버 저장 횟수',c:'var(--c4)',v:D.map(r=>f(r.h,'un')),type:'bar'},{n:'로그인 상태 방문 비율',c:'var(--c6)',v:D.map(r=>f(r.h,'v')?f(r.h,'vl')/f(r.h,'v'):0),type:'line',axis:'r',fmt:P}],{h:220,w:560})+'</div>';
 h+=`<div class="grid2" style="margin-top:12px">`+chart('신규 가입',L,[{n:'가입',c:'var(--c5)',v:D.map(r=>f(r.h,'su')),type:'bar'}],{h:200,w:560})+
  chart('기기 · 앱 (하루 방문)',L,[{n:'모바일',c:'var(--c2)',v:D.map(r=>f(r.h,'dv:m')),stack:1,type:'bar'},{n:'컴퓨터',c:'var(--c1)',v:D.map(r=>f(r.h,'dv:d')),stack:1,type:'bar'},{n:'설치한 앱으로',c:'var(--c3)',v:D.map(r=>f(r.h,'ap:app')),type:'line'}],{h:200,w:560,note:'기기 · 앱 · 시간대 · 유입처 · 버전은 5.4.2부터 모입니다.'})+'</div>';
 /* 전송량 */
 let cum=0;const fd=D.map(r=>est(r.h)),cu=D.map((r,i)=>{if(r.d.slice(8)==='01')cum=0;cum+=fd[i];return cum});
 h+=`<h2>예상 전송량 (Vercel) <small>방문 × 게임 페이지 ${B(PAGE_GZ)} + 저장 · 막대 = 하루, 선 = 그달 누적</small></h2>`+chart('하루 전송량과 월 누적',L,[{n:'하루',c:'var(--c5)',v:fd,type:'bar',fmt:B},{n:'그달 누적',c:'var(--c2)',v:cu,type:'line',axis:'r',fmt:B}],{hlines:[{v:LIMITS.fdt,n:'무료 한도 100GB',c:'#ff5a4f',axis:'r'}]});
 /* 요일 · 시간대 */
 const wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];D.forEach(r=>{const w=new Date(r.d+'T00:00:00Z').getUTCDay();wd[w]+=f(r.h,'v');wn[w]++});const WN=['일','월','화','수','목','금','토'];
 const hr=agg(D,'hr:');const HR=Array.from({length:24},(_,i)=>hr[String(i).padStart(2,'0')]||0);

  chart('시간대별 방문 (한국 시간)',HR.map((_,i)=>i+'시'),[{n:'방문',c:'var(--c4)',v:HR,type:'bar'}],{h:200,w:560})+'</div>';

 h+=`<h2>어디서 · 무엇으로 오는가</h2><div class="grid3">`+hbars('들어온 곳 (도메인)',ref,{name:refN,c:'var(--c2)',note:'다른 사이트의 링크를 눌러 들어오면 그 사이트 이름이 남습니다. 갑자기 방문이 늘면 여기서 원인을 찾을 수 있습니다.'})+
  pie('기기',[['모바일',t.mo,'#e8b04a'],['컴퓨터',t.dv-t.mo,'#4fa3e0']])+pie('접속 방식',[['설치한 앱',t.app,'#5fc48a'],['브라우저',t.ap-t.app,'#8fa19c']])+'</div>';
 h+=`<div class="grid2" style="margin-top:12px">`+hbars('게임 버전',agg(D,'vr:'),{c:'var(--c4)',name:k=>'Ver. '+k})+'<div></div></div>';
 /* 지역 */
 const loc=agg(D,'l:');const cc={};for(const k in loc){const c=k.split('/')[0];cc[c]=(cc[c]||0)+loc[k]}
 let dn;try{dn=new Intl.DisplayNames(['ko'],{type:'region'})}catch(e){}const cn=c=>{try{return dn&&c!=='??'?dn.of(c)+' ('+c+')':'알 수 없음'}catch(e){return c}};
 h+=`<h2>접속 지역</h2><div class="grid2">`+hbars('국가',cc,{name:cn,c:'var(--c3)'})+hbars('도시',loc,{name:k=>k.replace(/^([A-Z?]{2})\//,(m,c)=>c+' · '),c:'var(--c6)',top:15})+'</div>';
 /* 표 */
 h+=`<h2>일별 상세 <small>최신 날짜가 위 · [CSV]로 받을 수 있습니다</small></h2><div class="tw"><table><tr><th>날짜</th><th>방문</th><th>고유</th><th>로그인</th><th>플레이 인원</th><th>플레이 합계</th><th>1인 평균</th><th>저장</th><th>저장 용량</th><th>가입</th><th>모바일</th><th>앱</th><th>예상 전송</th></tr>`+
  D.slice().reverse().map(r=>{const P_=f(r.h,'p');return `<tr><td>${r.d} (${WN[new Date(r.d+'T00:00:00Z').getUTCDay()]})</td><td>${N(f(r.h,'v'))}</td><td>${N(r.u)}</td><td>${N(f(r.h,'vl'))}</td><td>${N(r.pu)}</td><td>${H(P_)}</td><td>${r.pu?H(P_/r.pu):'-'}</td><td>${N(f(r.h,'un'))}</td><td>${B(f(r.h,'ub'))}</td><td>${N(f(r.h,'su'))}</td><td>${N(f(r.h,'dv:m'))}</td><td>${N(f(r.h,'ap:app'))}</td><td>${B(est(r.h))}</td></tr>`}).join('')+'</table></div>';
 h+=`<h2>읽는 법</h2><ul class="mu"><li>고유 방문자·플레이 인원은 근사 집계(오차 약 1%)입니다. 기간 전체의 고유 방문자는 날짜를 합친 중복 없는 수입니다.</li><li>플레이 시간은 화면을 보고 있고 2분 안에 조작이 있었던 시간만 셉니다.</li><li>1인 하루 평균 플레이 = 그날 플레이 합계 ÷ 그날 플레이한 사람 수.</li><li>지역은 Vercel이 접속 주소로 판단한 국가·도시이며, 주소 자체는 저장하지 않습니다. 들어온 곳은 링크를 누른 사이트의 도메인만 남깁니다.</li><li>그래프의 막대·점에 마우스를 올리면 값이 보입니다.</li></ul>`;
